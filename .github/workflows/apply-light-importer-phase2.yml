name: Apply light importer phase 2

on:
  push:
    branches:
      - tuya-local-light-independent-color-range

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: tuya-local-light-independent-color-range

      - name: Apply importer changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          importer = Path("tools/import_tuya_local.py")

          replace_once(
              importer,
              '''def _configure_light_scale(\n    config: dict[str, Any],\n    *,\n    minimum: int,\n    maximum: int,\n    reason: str,\n    require_lower: bool,\n) -> None:\n    existing_upper = config.get("brightness_upper")\n    if existing_upper is not None and existing_upper != maximum:\n        raise ConversionError(f"{reason}_range_mismatch")\n\n    existing_lower = config.get("brightness_lower")\n    if require_lower and existing_lower is not None and existing_lower != minimum:\n        raise ConversionError(f"{reason}_range_mismatch")\n\n    if existing_upper is None:\n        config["brightness_upper"] = maximum\n    if existing_lower is None:\n        config["brightness_lower"] = minimum if require_lower else 0\n''',
              '''def _configure_light_scale(\n    config: dict[str, Any],\n    *,\n    minimum: int,\n    maximum: int,\n    reason: str,\n    require_lower: bool,\n) -> None:\n    existing_upper = config.get("brightness_upper")\n    existing_lower = config.get("brightness_lower")\n\n    if reason == "light_rgbhsv":\n        if existing_upper is None and existing_lower is None:\n            config["brightness_lower"] = minimum\n            config["brightness_upper"] = maximum\n            return\n\n        if existing_lower == minimum and existing_upper == maximum:\n            return\n\n        config["color_brightness_lower"] = minimum\n        config["color_brightness_upper"] = maximum\n        return\n\n    if existing_upper is not None and existing_upper != maximum:\n        raise ConversionError(f"{reason}_range_mismatch")\n\n    if require_lower and existing_lower is not None and existing_lower != minimum:\n        raise ConversionError(f"{reason}_range_mismatch")\n\n    if existing_upper is None:\n        config["brightness_upper"] = maximum\n    if existing_lower is None:\n        config["brightness_lower"] = minimum if require_lower else 0\n''',
          )

          replace_once(
              importer,
              '''        observed: dict[str, str] = {}\n        for rule in rules:\n            if set(rule) - {"dps_val", "value", "hidden"}:\n                raise ConversionError("light_color_mode_mapping")\n            if rule.get("hidden") is True:\n                raise ConversionError("light_color_mode_hidden")\n            raw = rule.get("dps_val")\n            value = rule.get("value")\n            if not isinstance(raw, str) or not isinstance(value, str):\n                raise ConversionError("light_color_mode_mapping")\n            if value not in {"hs", "color_temp"}:\n                # Scene/music/effect modes cannot be reproduced by the current\n                # LocalTuya light config without their dedicated data DPs.\n                raise ConversionError("light_color_mode_effects")\n            expected_raw = "colour" if value == "hs" else "white"\n            if raw != expected_raw:\n                raise ConversionError("light_color_mode_raw_value")\n            if value in observed.values() or raw in observed:\n                raise ConversionError("light_color_mode_duplicate")\n            observed[raw] = value\n''',
              '''        observed: dict[str, str] = {}\n        scene_values: dict[str, str] = {}\n        for rule in rules:\n            if set(rule) - {"dps_val", "value", "hidden"}:\n                raise ConversionError("light_color_mode_mapping")\n            if rule.get("hidden") is True:\n                raise ConversionError("light_color_mode_hidden")\n            raw = rule.get("dps_val")\n            value = rule.get("value")\n            if not isinstance(raw, str) or not isinstance(value, str):\n                raise ConversionError("light_color_mode_mapping")\n\n            if raw in observed or value in observed.values():\n                raise ConversionError("light_color_mode_duplicate")\n\n            if value in {"hs", "color_temp"}:\n                expected_raw = "colour" if value == "hs" else "white"\n                if raw != expected_raw:\n                    raise ConversionError("light_color_mode_raw_value")\n                observed[raw] = value\n                continue\n\n            if raw.startswith("scene_"):\n                friendly = value.strip()\n                if not friendly or friendly in scene_values:\n                    raise ConversionError("light_color_mode_duplicate")\n                scene_values[friendly] = raw\n                observed[raw] = value\n                continue\n\n            if raw == "music" and value.strip().casefold() == "music":\n                config["music_mode"] = True\n                observed[raw] = value\n                continue\n\n            if raw == "scene":\n                raise ConversionError("light_scene_data_required")\n\n            raise ConversionError("light_color_mode_effects")\n\n        if scene_values:\n            config["scene_values"] = scene_values\n''',
          )

          tests = Path("tests/test_import_tuya_local_light.py")
          replace_once(
              tests,
              '''    def test_effect_modes_are_rejected(self):\n        with self.assertRaisesRegex(ConversionError, "light_color_mode_effects"):\n            convert_profile(\n                {\n                    "products": [{"id": "scene-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 20, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 21,\n                                    "type": "string",\n                                    "name": "color_mode",\n                                    "mapping": [\n                                        {"dps_val": "scene", "value": "Scene"}\n                                    ],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="scene_light.yaml",\n            )\n''',
              '''    def test_bare_scene_mode_requires_scene_data(self):\n        with self.assertRaisesRegex(ConversionError, "light_scene_data_required"):\n            convert_profile(\n                {\n                    "products": [{"id": "scene-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 20, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 21,\n                                    "type": "string",\n                                    "name": "color_mode",\n                                    "mapping": [\n                                        {"dps_val": "scene", "value": "Scene"}\n                                    ],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="scene_light.yaml",\n            )\n\n    def test_mode_only_scenes_convert_to_scene_values(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "mode-scene-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 20, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 21,\n                                "type": "string",\n                                "name": "color_mode",\n                                "mapping": [\n                                    {"dps_val": "scene_1", "value": "Flash scene 1"},\n                                    {"dps_val": "scene_2", "value": "Flash scene 2"},\n                                ],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="mode_scene_light.yaml",\n        )\n\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(\n            config["scene_values"],\n            {\n                "Flash scene 1": "scene_1",\n                "Flash scene 2": "scene_2",\n            },\n        )\n        self.assertEqual(config["color_mode"], 21)\n\n    def test_simple_music_mode_is_preserved(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "music-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 20, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 21,\n                                "type": "string",\n                                "name": "color_mode",\n                                "mapping": [\n                                    {"dps_val": "music", "value": "Music"}\n                                ],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="music_light.yaml",\n        )\n\n        self.assertTrue(mapping["entities"][0]["config"]["music_mode"])\n''',
          )

          replace_once(
              tests,
              '''    def test_rgb_brightness_range_mismatch_is_rejected(self):\n        with self.assertRaisesRegex(\n            ConversionError, "light_rgbhsv_range_mismatch"\n        ):\n            convert_profile(\n                {\n                    "products": [{"id": "rgb-range-mismatch"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 20, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 22,\n                                    "type": "integer",\n                                    "name": "brightness",\n                                    "range": {"min": 10, "max": 1000},\n                                },\n                                {\n                                    "id": 21,\n                                    "type": "string",\n                                    "name": "color_mode",\n                                    "mapping": [\n                                        {"dps_val": "colour", "value": "hs"}\n                                    ],\n                                },\n                                {\n                                    "id": 24,\n                                    "type": "hex",\n                                    "name": "rgbhsv",\n                                    "format": [\n                                        {\n                                            "name": "h",\n                                            "bytes": 2,\n                                            "range": {"min": 0, "max": 360},\n                                        },\n                                        {\n                                            "name": "s",\n                                            "bytes": 2,\n                                            "range": {"min": 0, "max": 1000},\n                                        },\n                                        {\n                                            "name": "v",\n                                            "bytes": 2,\n                                            "range": {"min": 0, "max": 1000},\n                                        },\n                                    ],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="rgb_range_mismatch.yaml",\n            )\n''',
              '''    def test_rgb_brightness_range_mismatch_uses_independent_color_range(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "rgb-range-mismatch"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 20, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 22,\n                                "type": "integer",\n                                "name": "brightness",\n                                "range": {"min": 10, "max": 1000},\n                            },\n                            {\n                                "id": 21,\n                                "type": "string",\n                                "name": "color_mode",\n                                "mapping": [\n                                    {"dps_val": "colour", "value": "hs"}\n                                ],\n                            },\n                            {\n                                "id": 24,\n                                "type": "hex",\n                                "name": "rgbhsv",\n                                "format": [\n                                    {\n                                        "name": "h",\n                                        "bytes": 2,\n                                        "range": {"min": 0, "max": 360},\n                                    },\n                                    {\n                                        "name": "s",\n                                        "bytes": 2,\n                                        "range": {"min": 0, "max": 1000},\n                                    },\n                                    {\n                                        "name": "v",\n                                        "bytes": 2,\n                                        "range": {"min": 0, "max": 1000},\n                                    },\n                                ],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="rgb_range_mismatch.yaml",\n        )\n\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["brightness_lower"], 10)\n        self.assertEqual(config["brightness_upper"], 1000)\n        self.assertEqual(config["color_brightness_lower"], 0)\n        self.assertEqual(config["color_brightness_upper"], 1000)\n''',
          )

          replace_once(
              tests,
              '''        self.assertEqual(config["brightness_upper"], 1000)\n\n    def test_optional_light_capability_becomes_optional_dp(self):\n''',
              '''        self.assertEqual(config["brightness_upper"], 1000)\n        self.assertNotIn("color_brightness_lower", config)\n        self.assertNotIn("color_brightness_upper", config)\n\n    def test_optional_light_capability_becomes_optional_dp(self):\n''',
          )

          workflow = Path(".github/workflows/tuya-local-static-import.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "Run conservative importer with independent HSV range support",
              "Run conservative importer",
          )
          text = text.replace(
              "python tools/analyze_light_color_range_gain.py \\",
              "python tools/import_tuya_local.py \\",
          )
          workflow.write_text(text, encoding="utf-8")

          Path("tools/analyze_light_color_range_gain.py").unlink(missing_ok=True)
          Path(".github/workflows/apply-light-importer-phase2.yml").unlink()
          PY

      - name: Check diff whitespace
        run: git diff --check

      - name: Run importer tests
        run: python -m unittest discover -s tests -p 'test_import_tuya_local*.py' -v

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import independent HSV ranges and mode-only light scenes"
          git push origin HEAD:tuya-local-light-independent-color-range
