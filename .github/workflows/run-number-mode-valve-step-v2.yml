name: Run number mode and valve step importer v2

on:
  push:
    paths:
      - .github/workflows/run-number-mode-valve-step-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply importer patch from reviewed helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/patch-number-mode-valve-step.yml').read_text()
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'number-mode-valve-step-patch', 'exec'))
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned profiles and next blocker
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import import_tuya_local as base
          from import_tuya_local import ConversionError
          from import_tuya_local_fingerprints import convert_productless_profile
          root = Path('/tmp/tuya-local/custom_components/tuya_local/devices')
          rev = '38347807cfc81ae8789974d98532eb928f42f174'

          qoto = root / 'qoto_03_sprinkler.yaml'
          result = convert_productless_profile(yaml.safe_load(qoto.read_text()), source_file=qoto.name, revision=rev)
          valve = next(e for e in result['entities'] if e['platform'] == 'valve')
          assert valve['config']['valve_position_step'] == 5.0

          dekala = root / 'dekala_lumos_alarm_clock.yaml'
          profile = yaml.safe_load(dekala.read_text())
          number_entity = next(
              e for e in profile['entities']
              if e.get('entity') == 'number' and e.get('mode') == 'slider'
          )
          converted, _, _ = base._convert_number(number_entity)
          assert converted['config']['number_mode'] == 'slider'
          try:
              convert_productless_profile(profile, source_file=dekala.name, revision=rev)
          except ConversionError as exc:
              assert str(exc) == 'siren_duplicate_dp_id', str(exc)
          else:
              raise AssertionError('Dekala unexpectedly converted without the known next blocker')
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local.py tests/test_import_tuya_local_core_platforms.py
          git diff --cached --check
          git commit -m "Import number modes and valve position steps"
          git push origin HEAD:develop
