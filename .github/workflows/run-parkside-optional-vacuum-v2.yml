name: Run Parkside optional vacuum patch

on:
  push:
    paths:
      - .github/workflows/run-parkside-optional-vacuum-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply reviewed patch body
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/patch-parkside-optional-vacuum.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          block = []
          for line in lines[start + 1:end]:
              block.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(block), 'parkside-patch', 'exec'))
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned Parkside profile
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          rm -rf /tmp/parkside-generated && mkdir -p /tmp/parkside-generated
          python tools/import_tuya_local_fingerprints.py /tmp/tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/parkside-generated \
            --json /tmp/parkside-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/parkside-report.json').read_text())
          item = next(x for x in report['results'] if x['file'] == 'parkside_ppwd30a1_vacuum.yaml')
          assert item['status'] == 'convertible_fingerprint', item
          payload = json.loads((Path('/tmp/parkside-generated') / f"{item['mapping_id']}.json").read_text())
          mapping = payload['mappings'][0]
          vacuum = next(e for e in mapping['entities'] if e['platform'] == 'vacuum')
          config = vacuum['config']
          assert config['vacuum_status_dp'] == 4, config
          assert config['vacuum_status_values'] == {}, config
          assert 4 in mapping['match']['optional_dps'], mapping['match']
          assert 4 not in mapping['match']['required_dps'], mapping['match']
          print('PINNED_CONVERTED', item)
          print('STATUS_COUNTS', report['status_counts'])
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_vacuum_optional_status.py
          git diff --cached --check
          git commit -m "Support optional raw vacuum status"
          git push origin HEAD:develop
