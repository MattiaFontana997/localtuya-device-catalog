name: Inspect Productless Importer Gaps

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/inspect-productless-gaps.yml"
      - "tools/import_tuya_local_fingerprints.py"
      - "tools/import_tuya_local_productless.py"
      - "tests/test_import_tuya_local_productless.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Test extended productless converters
        run: python -m unittest tests.test_import_tuya_local_productless -v
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Analyze exact skipped profiles
        shell: bash
        run: |
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --json /tmp/report.json >/tmp/summary.txt
          cat /tmp/summary.txt
          python - <<'PY'
          import json
          from collections import defaultdict
          report=json.load(open('/tmp/report.json', encoding='utf-8'))
          groups=defaultdict(list)
          for item in report['results']:
              if item['status'] != 'skipped':
                  continue
              for reason in item['reasons']:
                  groups[reason].append(item['file'])
          for reason in sorted(groups, key=lambda r:(-len(groups[r]), r)):
              print(f"GAP {reason} {len(groups[reason])}: " + ", ".join(groups[reason]))
          PY