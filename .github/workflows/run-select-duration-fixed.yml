name: Run corrected select duration class

on:
  push:
    paths:
      - .github/workflows/run-select-duration-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch with corrected metadata test
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('.github/workflows/patch-select-duration-class.yml').read_text()
          payloads = re.findall(r"base64\.b64decode\('([^']+)'\)\.decode\(\)", source)
          if len(payloads) < 2:
              raise SystemExit('encoded Select duration payloads not found')
          helper = base64.b64decode(payloads[0]).decode()
          test_text = base64.b64decode(payloads[1]).decode()
          test_text = test_text.replace(
              '        self.assertEqual(converted["config"]["entity_category"], "config")\n',
              '',
          )

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          anchor = 'def _normalize_string_select_raw_mapping(entity: dict[str, Any]) -> dict[str, Any]:\n'
          if '_prepare_productless_select_device_class' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one Select normalization anchor, found {text.count(anchor)}')
              text = text.replace(anchor, helper + anchor, 1)
          old = '        elif platform == "select":\n            flagged = _normalize_string_select_raw_mapping(flagged)\n'
          new = '        elif platform == "select":\n            flagged = _prepare_productless_select_device_class(flagged)\n            flagged = _normalize_string_select_raw_mapping(flagged)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Select wrapper block not found')
          path.write_text(text)
          Path('tests/test_productless_select_device_class.py').write_text(test_text)
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5" pytest
      - name: Run targeted tests
        run: python -m pytest -q tests/test_productless_select_device_class.py tests/test_productless_select_string_mapping.py tests/test_import_tuya_local_productless.py
      - name: Commit importer changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_select_device_class.py
          git diff --cached --check
          git commit -m "Handle metadata-only duration Select class"
          git push origin HEAD:develop
