name: Patch climate unit default mapping

on:
  push:
    paths:
      - .github/workflows/patch-climate-unit-default.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply corrected patch
        run: python .github/scripts/patch_climate_unit_default.py
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5" pytest
      - name: Run full catalog regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit importer support and aligned regressions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_climate_unit_default.py tests/test_import_tuya_local_productless.py tests/test_productless_fan_mappings.py
          git diff --cached --check
          git commit -m "Import default climate temperature-unit mappings"
          git push origin HEAD:develop
