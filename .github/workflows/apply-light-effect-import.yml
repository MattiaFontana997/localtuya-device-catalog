name: Apply dedicated light effect importer patch

on:
  push:
    branches:
      - tuya-local-light-effect-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tuya-local-light-effect-import
      - name: Apply importer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          importer = Path('tools/import_tuya_local.py')
          text = importer.read_text(encoding='utf-8')

          old = '    supported = {"switch", "brightness", "color_mode", "color_temp", "rgbhsv"}\n'
          new = '    supported = {"switch", "brightness", "color_mode", "color_temp", "rgbhsv", "effect"}\n'
          if old not in text:
              raise SystemExit('light supported DP anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    _merge_membership(required, optional, switch)\n\n    configured_scene_values = dict(scene_values or {})\n'''
          addition = '''    _merge_membership(required, optional, switch)\n\n    effect = dps.get("effect")\n    if effect is not None:\n        _check_common_dp_semantics(effect, writable=True)\n        if _dp_type(effect) != "string":\n            raise ConversionError("light_effect_type")\n        rules = _mapping_rules(effect)\n        if not rules:\n            raise ConversionError("light_effect_missing_mapping")\n\n        effect_values: dict[str, str] = {}\n        raw_effects: set[str] = set()\n        for rule in rules:\n            if set(rule) - {"dps_val", "value", "hidden"}:\n                raise ConversionError("light_effect_mapping")\n            if rule.get("hidden") is True:\n                raise ConversionError("light_effect_hidden")\n            raw = rule.get("dps_val")\n            friendly = rule.get("value")\n            if (\n                not isinstance(raw, str)\n                or not raw\n                or not isinstance(friendly, str)\n                or not friendly.strip()\n            ):\n                raise ConversionError("light_effect_non_string_mapping")\n            friendly = friendly.strip()\n            if raw in raw_effects or friendly in effect_values:\n                raise ConversionError("light_effect_duplicate")\n            raw_effects.add(raw)\n            effect_values[friendly] = raw\n\n        config["effect"] = _dp_id(effect)\n        config["effect_values"] = effect_values\n        _merge_membership(required, optional, effect)\n\n    configured_scene_values = dict(scene_values or {})\n'''
          if anchor not in text:
              raise SystemExit('light effect insertion anchor not found')
          importer.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          validator = Path('tools/validate_catalog.py')
          text = validator.read_text(encoding='utf-8')
          old = '    "color",\n    "scene",\n    "current",\n'
          new = '    "color",\n    "scene",\n    "effect",\n    "current",\n'
          if old not in text:
              raise SystemExit('validator DP reference anchor not found')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')

          light_tests = Path('tests/test_import_tuya_local_light.py')
          tests = light_tests.read_text(encoding='utf-8')
          anchor = '''    def test_unknown_light_attribute_is_rejected(self):\n'''
          addition = '''    def test_dedicated_effect_mapping_converts_exact_values(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "effect-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 1, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 104,\n                                "type": "string",\n                                "name": "effect",\n                                "optional": True,\n                                "mapping": [\n                                    {"dps_val": "1", "value": "Combination"},\n                                    {"dps_val": "2", "value": "In Wave"},\n                                    {"dps_val": "8", "value": "Steady"},\n                                ],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="effect_light.yaml",\n        )\n\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["effect"], 104)\n        self.assertEqual(\n            config["effect_values"],\n            {\n                "Combination": "1",\n                "In Wave": "2",\n                "Steady": "8",\n            },\n        )\n        self.assertEqual(mapping["match"]["required_dps"], [1])\n        self.assertEqual(mapping["match"]["optional_dps"], [104])\n\n    def test_dedicated_effect_mapping_rejects_non_string_raw_value(self):\n        with self.assertRaisesRegex(\n            ConversionError, "light_effect_non_string_mapping"\n        ):\n            convert_profile(\n                {\n                    "products": [{"id": "bad-effect-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {\n                                    "id": 1,\n                                    "type": "boolean",\n                                    "name": "switch",\n                                },\n                                {\n                                    "id": 2,\n                                    "type": "string",\n                                    "name": "effect",\n                                    "mapping": [\n                                        {"dps_val": 1, "value": "Scene"}\n                                    ],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="bad_effect_light.yaml",\n            )\n\n'''
          if anchor not in tests:
              raise SystemExit('light test insertion anchor not found')
          light_tests.write_text(tests.replace(anchor, addition + anchor, 1), encoding='utf-8')

          validator_tests = Path('tests/test_validate_catalog_v2.py')
          tests = validator_tests.read_text(encoding='utf-8')
          anchor = '''    def test_product_ids_are_deterministically_sorted(self):\n'''
          addition = '''    def test_effect_dp_must_be_declared_required_or_optional(self):\n        payload = document(\n            required=[1],\n            optional=[],\n            config={\n                "id": 1,\n                "platform": "switch",\n                "effect": 104,\n                "effect_values": {"Steady": "8"},\n            },\n        )\n        errors = self.validate(payload)\n        self.assertTrue(\n            any("missing from required_dps/optional_dps" in error for error in errors)\n        )\n\n'''
          if anchor not in tests:
              raise SystemExit('validator test insertion anchor not found')
          validator_tests.write_text(tests.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
          git diff --check
          python -m compileall -q tools tests
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/import_tuya_local.py tools/validate_catalog.py tests/test_import_tuya_local_light.py tests/test_validate_catalog_v2.py
          git commit -m 'Import dedicated Tuya Local light effects'
          git push origin HEAD:tuya-local-light-effect-import
