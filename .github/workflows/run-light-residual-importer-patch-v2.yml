name: Run residual light importer patch v2

on:
  push:
    paths:
      - .github/workflows/run-light-residual-importer-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply existing residual importer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-light-residual-importer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code_lines = []
          for line in workflow[start:end]:
              code_lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(code_lines) + '\n'
          exec(compile(code, 'residual-importer-patch', 'exec'), {})
          PY
      - name: Install dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run targeted tests
        run: |
          python -m unittest tests.test_import_tuya_local_light_residuals tests.test_import_tuya_local_light tests.test_import_tuya_local_light_switch_values tests.test_import_tuya_local_productless_time_duration tests.test_import_tuya_local_productless -v
      - name: Commit importer support
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local.py tools/import_tuya_local_productless.py tests/test_import_tuya_local_light_residuals.py tests/test_import_tuya_local_productless_time_duration.py
          git diff --cached --check
          git commit -m "Support residual light encodings and duration timers"
          git push origin HEAD:develop
