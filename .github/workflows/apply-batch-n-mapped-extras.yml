name: Apply Batch N Mapped Extra Importer

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-n-mapped-extras.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - run: python tools/_apply_batch_n_mapped_extras.py
      - run: python -m py_compile tools/import_tuya_local_productless.py tests/test_productless_mapped_extras.py
      - name: Run focused tests
        run: python -m unittest tests.test_productless_mapped_extras tests.test_productless_climate_hvac_action -v
      - name: Run full catalog suite
        run: python -m unittest discover -s tests -v
      - name: Commit importer and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_mapped_extras.py
          if git diff --cached --quiet; then
            echo "Mapped extra importer support already applied"
            exit 0
          fi
          git commit -m "Support mapped productless extra state attributes"
          git push origin HEAD:develop
