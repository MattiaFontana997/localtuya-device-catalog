name: Apply Batch G Multi-DP

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-g-multidp.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/_apply_batch_g_multidp.py
      - run: python -m py_compile tools/import_tuya_local_productless.py
      - run: python -m unittest tests.test_import_tuya_local_productless -v
      - name: Commit Batch G
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_import_tuya_local_productless.py
          git commit -m "Add lossless simple multi-DP productless imports"
          git push origin HEAD:develop
