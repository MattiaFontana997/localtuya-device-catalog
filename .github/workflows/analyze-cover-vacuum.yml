name: Analyze Tuya Local cover and vacuum shapes

on:
  push:
    branches:
      - tuya-local-cover-vacuum-import

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7'
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          path: upstream-tuya-local
          fetch-depth: 1
      - run: python tools/_analyze_cover_vacuum_shapes.py
