name: Validate Device Catalog

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restrict external community pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Changed files:"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"

          mapfile -t CHANGES < <(
            git diff --name-status "$BASE_SHA" "$HEAD_SHA"
          )

          if [ "${#CHANGES[@]}" -ne 1 ]; then
            echo "::error::A community contribution must add exactly one submission file."
            exit 1
          fi

          STATUS="$(printf '%s\n' "${CHANGES[0]}" | cut -f1)"
          FILE="$(printf '%s\n' "${CHANGES[0]}" | cut -f2)"

          if [ "$STATUS" != "A" ]; then
            echo "::error::Community contributions may only add a new file."
            exit 1
          fi

          case "$FILE" in
            submissions/*.json)
              ;;
            *)
              echo "::error::Community contributions may only add submissions/*.json"
              exit 1
              ;;
          esac

          if [ -L "$FILE" ]; then
            echo "::error::Submission files must not be symbolic links."
            exit 1
          fi

          echo "Allowed external submission: $FILE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install validator and tooling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"

      - name: Test catalog tooling
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate catalog and submissions
        run: |
          python tools/validate_catalog.py
