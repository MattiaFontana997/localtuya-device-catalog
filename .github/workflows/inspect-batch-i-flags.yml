name: Inspect Batch I Flags

on:
  push:
    branches: [develop]
    paths: [".github/workflows/inspect-batch-i-flags.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate current report
        run: python tools/import_tuya_local_fingerprints.py upstream-tuya-local --json /tmp/report.json >/tmp/summary.txt
      - name: Inspect flag blockers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          report=json.load(open('/tmp/report.json', encoding='utf-8'))
          target_reasons={'entity_hidden','dp_force','dp_persist_false'}
          root=Path('upstream-tuya-local/custom_components/tuya_local/devices')
          targets=[]
          for item in report['results']:
              reasons=set(item['reasons'])
              if item['status']=='skipped' and reasons & target_reasons:
                  targets.append((item['file'], sorted(reasons & target_reasons)))
          print('TARGET_COUNT', len(targets))
          for filename,reasons in targets:
              profile=yaml.safe_load((root/filename).read_text(encoding='utf-8'))
              print(f'PROFILE {filename} BLOCKERS={reasons}')
              for idx,entity in enumerate(profile.get('entities', [])):
                  eh=entity.get('hidden')
                  flagged=[]
                  for dp in entity.get('dps', []):
                      flags={k:dp.get(k) for k in ('force','persist','hidden','optional','readonly','sensitive') if k in dp}
                      if flags:
                          flagged.append({'id':dp.get('id'),'name':dp.get('name'),'type':dp.get('type'),'flags':flags,'mapping':dp.get('mapping')})
                  if eh is not None or flagged:
                      print('  ENTITY', idx, entity.get('entity'), 'hidden=', eh, 'category=', entity.get('category'))
                      for item in flagged:
                          print('    DP', item)
          PY
