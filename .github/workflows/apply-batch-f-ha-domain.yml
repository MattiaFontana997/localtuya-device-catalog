name: Apply Batch F HA-domain projection
on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-f-ha-domain.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - run: python tools/_add_batch_f_projection_test.py
      - run: python -m unittest tests.test_import_tuya_local_productless -v
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_import_tuya_local_productless.py
          git commit -m "Test advanced HVAC HA-domain projection"
          git push origin HEAD:develop
