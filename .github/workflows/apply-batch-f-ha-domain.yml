name: Apply Batch F HA-domain projection
on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-f-ha-domain.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - run: python tools/_apply_batch_f_ha_domain.py
      - run: python -m py_compile tools/import_tuya_local_productless.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py
          git commit -m "Project advanced mappings into HA value domain"
          git push origin HEAD:develop
