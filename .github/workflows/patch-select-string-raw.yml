name: Patch select string raw mappings

on:
  push:
    paths:
      - .github/workflows/patch-select-string-raw.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply lossless select string raw normalization
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          helper = base64.b64decode('').decode()
          test_text = base64.b64decode('').decode()

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          anchor = 'def _prepare_typed_productless_select(\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one typed select helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor)

          old = '        elif platform == "select":\n            flagged, typed_select_mapping = _prepare_typed_productless_select(flagged)\n'
          new = '        elif platform == "select":\n            flagged = _normalize_string_select_raw_mapping(flagged)\n            flagged, typed_select_mapping = _prepare_typed_productless_select(flagged)\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one select wrapper block, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text)
          Path('tests/test_productless_select_string_mapping.py').write_text(test_text)
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5" pytest
      - name: Run targeted tests
        run: python -m pytest -q tests/test_productless_select_string_mapping.py tests/test_import_tuya_local_productless.py
      - name: Commit importer changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_select_string_mapping.py
          git diff --cached --check
          git commit -m "Normalize scalar raw values for string selects"
          git push origin HEAD:develop
