name: Apply Batch H Binary Sensor

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-h-binary-sensor.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Apply importer patch
        run: python tools/_apply_batch_h_binary_sensor.py
      - name: Compile importer
        run: python -m py_compile tools/import_tuya_local_productless.py
      - name: Test productless importers
        run: python -m unittest tests.test_import_tuya_local_productless tests.test_import_tuya_local_productless_binary_sensor -v
      - name: Commit Batch H importer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py
          if git diff --cached --quiet; then
            echo "Importer already patched"
            exit 0
          fi
          git commit -m "Add lossless advanced binary sensor imports"
          git push origin HEAD:develop
