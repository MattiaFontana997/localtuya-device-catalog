name: Inspect Batch M Advanced Mapping V2

on:
  push:
    branches: [develop]
    paths: [".github/workflows/inspect-batch-m-advanced-v2.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Classify advanced blockers exactly
        shell: bash
        env:
          PYTHONPATH: tools
        run: |
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --json /tmp/report.json >/tmp/summary.txt
          cat /tmp/summary.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter, defaultdict
          import yaml

          report=json.load(open('/tmp/report.json', encoding='utf-8'))
          wanted=[]
          for item in report['results']:
              if item['status']!='skipped':
                  continue
              reasons=[r for r in item['reasons'] if r.startswith('advanced_mapping')]
              if reasons:
                  wanted.append((item['file'], reasons))
          print('ADVANCED_BLOCKED_PROFILE_COUNT', len(wanted))
          print('ADVANCED_REASON_COUNTS', dict(Counter(r for _,rs in wanted for r in rs)))
          root=Path('upstream-tuya-local/custom_components/tuya_local/devices')
          key_counts=Counter()
          cond_key_counts=Counter()
          shape_counts=Counter()
          for filename,reasons in wanted:
              profile=yaml.safe_load((root/filename).read_text(encoding='utf-8'))
              print('\nPROFILE', filename, 'REASONS', ','.join(reasons))
              for entity in profile.get('entities', []):
                  platform=entity.get('entity','?')
                  by_name={dp.get('name'):dp for dp in entity.get('dps',[]) if isinstance(dp,dict)}
                  for dp in entity.get('dps', []):
                      if not isinstance(dp,dict) or not isinstance(dp.get('mapping'),list):
                          continue
                      advanced=[]
                      for rule in dp['mapping']:
                          if not isinstance(rule,dict):
                              continue
                          keys=set(rule)&{'available','conditions','constraint','invalid','mapping','value_mirror','value_redirect','scale','invert','step','range','target_range','default'}
                          condkeys=set()
                          for cond in rule.get('conditions',[]) if isinstance(rule.get('conditions'),list) else []:
                              if isinstance(cond,dict):
                                  condkeys.update(set(cond))
                          if keys or condkeys:
                              advanced.append(rule)
                              key_counts.update(keys)
                              cond_key_counts.update(condkeys)
                      if not advanced:
                          continue
                      constraint_names={r.get('constraint') for r in advanced if isinstance(r.get('constraint'),str)}
                      redirect_names={r.get('value_redirect') for r in advanced if isinstance(r.get('value_redirect'),str)}
                      for r in advanced:
                          for c in r.get('conditions',[]) if isinstance(r.get('conditions'),list) else []:
                              if isinstance(c,dict) and isinstance(c.get('value_redirect'),str):
                                  redirect_names.add(c['value_redirect'])
                      deps={name:by_name.get(name) for name in sorted((constraint_names|redirect_names)-{None})}
                      print(' ENTITY',platform,'DP',json.dumps({k:v for k,v in dp.items() if k!='mapping'},sort_keys=True,default=str))
                      print('  MAPPING',json.dumps(advanced,sort_keys=True,default=str))
                      print('  DEPS',json.dumps(deps,sort_keys=True,default=str))
                      shape=(platform,dp.get('name'),tuple(sorted(set().union(*(set(r) for r in advanced)))))
                      shape_counts[shape]+=1
          print('\nKEY_COUNTS', dict(key_counts))
          print('CONDITION_KEY_COUNTS', dict(cond_key_counts))
          print('SHAPES')
          for shape,count in sorted(shape_counts.items(),key=lambda x:(-x[1],str(x[0]))):
              print(count, shape)
          PY
