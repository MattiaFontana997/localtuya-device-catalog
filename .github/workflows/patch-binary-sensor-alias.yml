name: Patch binary sensor raw aliases

on:
  push:
    paths:
      - .github/workflows/patch-binary-sensor-alias.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply importer patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()

          old = '''    result: dict[str, dict[str, Any]] = {}\n    seen_ids: set[int] = set()\n    for dp in dps:\n'''
          new = '''    result: dict[str, dict[str, Any]] = {}\n    seen_ids: dict[int, dict[str, Any]] = {}\n    for dp in dps:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        # Two semantic attributes pointing at the same raw DP can be meaningful\n        # in Tuya Local, but LocalTuya's catalog entity identity and raw-extra\n        # representation cannot reproduce that generically. Keep it fail-closed.\n        if dp_id in seen_ids:\n            raise ConversionError(f"{prefix}_duplicate_dp_id")\n        seen_ids.add(dp_id)\n        result[name] = dp\n'''
          new = '''        # Duplicate raw-DP aliases remain fail-closed generically. Binary\n        # sensors have one narrow lossless exception: one semantic ``sensor``\n        # DP may also be exposed under an unmapped raw diagnostic attribute.\n        # The alias must keep the exact raw type and required/optional\n        # membership so no second semantic source or fingerprint meaning is\n        # introduced.\n        previous = seen_ids.get(dp_id)\n        if previous is not None:\n            previous_name = previous.get("name")\n            primary = previous if previous_name == "sensor" else dp if name == "sensor" else None\n            alias = dp if name != "sensor" else previous if previous_name != "sensor" else None\n            safe_binary_alias = (\n                prefix == "binary_sensor"\n                and primary is not None\n                and alias is not None\n                and not _raw_mapping(alias)\n                and base._dp_type(primary) == base._dp_type(alias)\n                and base._dp_membership(primary) == base._dp_membership(alias)\n            )\n            if not safe_binary_alias:\n                raise ConversionError(f"{prefix}_duplicate_dp_id")\n            seen_ids[dp_id] = primary\n        else:\n            seen_ids[dp_id] = dp\n        result[name] = dp\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        # Constraint/redirect DPS are internal to Batch F and already retained\n        # in fingerprint membership. Do not expose them as unrelated raw attrs.\n        if dp_id in dependency_ids:\n            continue\n\n        # An extra DP with its own advanced mapping has HA-facing semantics of\n        # its own. Treating it as a raw attribute would silently discard them.\n        if dp_id in advanced_source_ids:\n            raise ConversionError(f"multi_dp_advanced_extra:{name}")\n'''
          new = '''        # Constraint/redirect DPS are normally internal to Batch F. For a\n        # binary sensor, however, an explicitly declared unmapped companion DP\n        # is also a Tuya Local extra-state attribute, so preserve that raw\n        # diagnostic instead of silently dropping it.\n        raw_binary_diagnostic = platform == "binary_sensor" and not _raw_mapping(dp)\n        if dp_id in dependency_ids and not raw_binary_diagnostic:\n            continue\n\n        # An extra DP with its own advanced mapping has HA-facing semantics of\n        # its own. The only safe alias is an unmapped binary-sensor attribute\n        # pointing at the same raw DP as the primary sensor.\n        if dp_id in advanced_source_ids:\n            primary_id = config.get("id")\n            same_primary_raw_alias = (\n                raw_binary_diagnostic\n                and primary_id is not None\n                and int(primary_id) == dp_id\n            )\n            if not same_primary_raw_alias:\n                raise ConversionError(f"multi_dp_advanced_extra:{name}")\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_productless_binary_sensor_alias.py')
          test.write_text('''"""Lossless duplicate raw-DP alias support for productless binary sensors."""\n\nimport sys\nimport unittest\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / "tools"))\nimport import_tuya_local as base\nimport import_tuya_local_productless  # noqa: F401\n\n\nclass ProductlessBinarySensorAliasTests(unittest.TestCase):\n    def test_advanced_sensor_keeps_raw_constraint_and_same_dp_aliases(self):\n        entity = {\n            "entity": "binary_sensor",\n            "class": "problem",\n            "dps": [\n                {\n                    "id": 116, "type": "bitfield", "name": "sensor",\n                    "mapping": [\n                        {\n                            "dps_val": 0, "value": True, "constraint": "fault_code",\n                            "conditions": [\n                                {"dps_val": 0, "value": False},\n                                {"dps_val": 4, "value": False},\n                            ],\n                        },\n                        {"value": True},\n                    ],\n                },\n                {"id": 115, "type": "bitfield", "name": "fault_code"},\n                {"id": 116, "type": "bitfield", "name": "fault_code_2"},\n            ],\n        }\n        converted, required, optional = base._CONVERTERS["binary_sensor"](entity)\n        config = converted["config"]\n        self.assertEqual(config["id"], 116)\n        self.assertIn("116", config["advanced_mapping_by_dp"])\n        self.assertEqual(\n            config["extra_state_attributes_dps"],\n            {"fault_code": 115, "fault_code_2": 116},\n        )\n        self.assertEqual(required, {115, 116})\n        self.assertEqual(optional, set())\n\n    def test_mapped_same_dp_alias_stays_fail_closed(self):\n        entity = {\n            "entity": "binary_sensor",\n            "dps": [\n                {\n                    "id": 10, "type": "integer", "name": "sensor",\n                    "mapping": [\n                        {"constraint": "mode", "conditions": [{"dps_val": 0, "value": False}]},\n                    ],\n                },\n                {"id": 11, "type": "integer", "name": "mode"},\n                {\n                    "id": 10, "type": "integer", "name": "alias",\n                    "mapping": [{"dps_val": 1, "value": "one"}],\n                },\n            ],\n        }\n        with self.assertRaisesRegex(base.ConversionError, "binary_sensor_duplicate_dp_id"):\n            base._CONVERTERS["binary_sensor"](entity)\n\n    def test_duplicate_non_primary_attributes_stay_fail_closed(self):\n        entity = {\n            "entity": "binary_sensor",\n            "dps": [\n                {\n                    "id": 10, "type": "integer", "name": "sensor",\n                    "mapping": [\n                        {"constraint": "mode", "conditions": [{"dps_val": 0, "value": False}]},\n                    ],\n                },\n                {"id": 11, "type": "integer", "name": "mode"},\n                {"id": 11, "type": "integer", "name": "mode_alias"},\n            ],\n        }\n        with self.assertRaisesRegex(base.ConversionError, "binary_sensor_duplicate_dp_id"):\n            base._CONVERTERS["binary_sensor"](entity)\n''')
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned Fairland profile
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from import_tuya_local_fingerprints import convert_productless_profile
          filename = 'fairland_rmic06_heatpump.yaml'
          path = Path('/tmp/tuya-local/custom_components/tuya_local/devices') / filename
          result = convert_productless_profile(
              yaml.safe_load(path.read_text()),
              source_file=filename,
              revision='38347807cfc81ae8789974d98532eb928f42f174',
          )
          problem = [
              entity for entity in result['entities']
              if entity['config'].get('id') == 116
              and entity.get('platform') == 'binary_sensor'
          ]
          assert len(problem) == 1, problem
          config = problem[0]['config']
          assert config['extra_state_attributes_dps'] == {
              'fault_code': 115, 'fault_code_2': 116
          }, config
          print('PINNED_CONVERTED', filename)
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_binary_sensor_alias.py
          git diff --cached --check
          git commit -m "Support binary sensor raw DP aliases"
          git push origin HEAD:develop
