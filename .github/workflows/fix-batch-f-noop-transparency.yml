name: Fix Batch F no-op transparency

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-batch-f-noop-transparency.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Keep non-advanced entities untouched
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _prepare_advanced_entity(
              entity: dict[str, Any], platform: str
          ) -> tuple[dict[str, Any], dict[str, list[dict[str, Any]]], set[int]]:
              by_name = _named_dps(entity, platform)
              advanced_by_dp: dict[str, list[dict[str, Any]]] = {}
          '''
          new = '''def _prepare_advanced_entity(
              entity: dict[str, Any], platform: str
          ) -> tuple[dict[str, Any], dict[str, list[dict[str, Any]]], set[int]]:
              raw_dps = entity.get("dps")
              if not isinstance(raw_dps, list) or not raw_dps:
                  return entity, {}, set()
              has_advanced = False
              for raw_dp in raw_dps:
                  if not isinstance(raw_dp, dict):
                      continue
                  for rule in _raw_mapping(raw_dp):
                      if set(rule) & (_ADVANCED_SOURCE_KEYS | _UNSUPPORTED_ADVANCED_KEYS):
                          has_advanced = True
                          break
                  if has_advanced:
                      break
              if not has_advanced:
                  return entity, {}, set()

              by_name = _named_dps(entity, platform)
              advanced_by_dp: dict[str, list[dict[str, Any]]] = {}
          '''
          if old not in text:
              raise SystemExit('expected prepare block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py
          git commit -m "Keep Batch F transparent for non-advanced entities"
          git push origin HEAD:develop
