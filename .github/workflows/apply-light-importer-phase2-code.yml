name: Apply light importer phase 2 code

on:
  push:
    branches:
      - tuya-local-light-independent-color-range

permissions:
  contents: write

jobs:
  patch-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: tuya-local-light-independent-color-range

      - name: Reuse tested patch while preserving workflows
        shell: bash
        run: |
          cp .github/workflows/tuya-local-static-import.yml /tmp/tuya-local-static-import.yml
          cp .github/workflows/apply-light-importer-phase2.yml /tmp/apply-light-importer-phase2.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-light-importer-phase2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          PY\n", start)
          block = source[start:end]
          script = ''.join(line[10:] if line.startswith('          ') else line for line in block.splitlines(keepends=True))
          Path('/tmp/light_importer_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/light_importer_patch.py
          cp /tmp/tuya-local-static-import.yml .github/workflows/tuya-local-static-import.yml
          cp /tmp/apply-light-importer-phase2.yml .github/workflows/apply-light-importer-phase2.yml

      - name: Check diff whitespace
        run: git diff --check

      - name: Run importer tests
        run: python -m unittest discover -s tests -p 'test_import_tuya_local*.py' -v

      - name: Commit code-only patch
        shell: bash
        run: |
          if git diff --quiet -- tools/import_tuya_local.py tests/test_import_tuya_local_light.py tools/analyze_light_color_range_gain.py; then
            echo "Code patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/import_tuya_local.py tests/test_import_tuya_local_light.py tools/analyze_light_color_range_gain.py
          git commit -m "Import independent HSV ranges and mode-only light scenes"
          git push origin HEAD:tuya-local-light-independent-color-range
