name: Extend Batch F HA-domain projection

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/extend-batch-f-ha-domain.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Extend advanced projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text(encoding='utf-8')

          old_skip = '''    for source in rules:
              if not (set(source) & (_ADVANCED_SOURCE_KEYS | _UNSUPPORTED_ADVANCED_KEYS)):
                  continue
              unsupported = set(source) & _UNSUPPORTED_ADVANCED_KEYS
          '''
          new_skip = '''    transform_keys = {"scale", "invert", "step", "range", "target_range"}
              for source in rules:
                  unsupported = set(source) & _UNSUPPORTED_ADVANCED_KEYS
          '''
          if old_skip not in text:
              raise SystemExit('translator loop block not found')
          text = text.replace(old_skip, new_skip)

          old_allowed = '''        allowed_source = _RUNTIME_RULE_BASE_KEYS | {
                  "conditions", "constraint", "value_redirect",
                  # These simple transforms remain in the base projection. They are
                  # intentionally not duplicated into the advanced rule.
                  "scale", "invert", "step", "range", "target_range", "default",
              }
              if set(source) - allowed_source:
                  raise ConversionError("advanced_mapping_rule_semantics")

              rule: dict[str, Any] = {}
          '''
          new_allowed = '''        allowed_source = _RUNTIME_RULE_BASE_KEYS | {
                  "conditions", "constraint", "value_redirect",
                  "scale", "invert", "step", "range", "target_range", "default",
              }
              if set(source) - allowed_source:
                  raise ConversionError("advanced_mapping_rule_semantics")
              # When one DP has conditional/redirect semantics, LocalTuya's advanced
              # mapper becomes authoritative for the complete DP mapping. Mixing in
              # numeric transforms is safe only once importer-side HA range/precision
              # metadata can be derived from every branch, so keep those fail-closed.
              if set(source) & transform_keys:
                  raise ConversionError("advanced_mapping_rule_transform_semantics")

              rule: dict[str, Any] = {}
          '''
          if old_allowed not in text:
              raise SystemExit('allowed source block not found')
          text = text.replace(old_allowed, new_allowed)

          start = text.index('def _project_mapping_for_base(')
          end = text.index('\n\ndef _validate_consumed_dependency', start)
          replacement = '''def _project_mapping_for_base(dp: dict[str, Any]) -> dict[str, Any]:
              """Expose the HA-facing value domain to the mature base converter.

              Once a DP is handled by LocalTuya advanced_mapping_by_dp, ``dps()``
              returns HA-facing values rather than the raw Tuya scalar. Platform
              converters still need to know the legal HA values (HVAC modes,
              actions, presets, etc.), so provide an identity mapping over that
              post-mapping domain. The real raw translation remains exclusively in
              advanced_mapping_by_dp.
              """
              projected = copy.deepcopy(dp)
              rules = _raw_mapping(dp)
              outputs: list[Any] = []
              missing = object()

              def add_output(value: Any) -> None:
                  if value is missing:
                      raise ConversionError("advanced_mapping_unbounded_output")
                  value = _runtime_scalar(value, "advanced_mapping_projection_scalar")
                  if value is None:
                      raise ConversionError("advanced_mapping_projection_none")
                  if not any(value == seen and type(value) is type(seen) for seen in outputs):
                      outputs.append(value)

              for source in rules:
                  if source.get("invalid") is True or source.get("hidden") is True:
                      continue
                  conditions = source.get("conditions")
                  if isinstance(conditions, list) and conditions:
                      for condition in conditions:
                          if not isinstance(condition, dict):
                              raise ConversionError("advanced_mapping_condition")
                          if condition.get("invalid") is True or condition.get("hidden") is True:
                              continue
                          value = condition.get(
                              "value", source.get("value", source.get("dps_val", missing))
                          )
                          add_output(value)
                  else:
                      add_output(source.get("value", source.get("dps_val", missing)))

              if not outputs:
                  raise ConversionError("advanced_mapping_empty_projection")
              kinds = {bool if isinstance(v, bool) else type(v) for v in outputs}
              if len(kinds) != 1:
                  raise ConversionError("advanced_mapping_mixed_output_types")
              kind = next(iter(kinds))
              if kind is str:
                  projected["type"] = "string"
              elif kind is bool:
                  projected["type"] = "boolean"
              elif kind is int:
                  projected["type"] = "integer"
              else:
                  raise ConversionError("advanced_mapping_projection_type")

              projected["mapping"] = [
                  {"dps_val": value, "value": value} for value in outputs
              ]
              return projected
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/import_tuya_local_productless.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py
          git commit -m "Project advanced mappings into HA value domain"
          git push origin HEAD:develop
