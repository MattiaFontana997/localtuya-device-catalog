name: Refresh Batch K Fan Catalog

on:
  push:
    branches: [develop]
    paths: [".github/workflows/refresh-batch-k-catalog.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate productless candidates
        shell: bash
        run: |
          rm -rf /tmp/batch-k-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/batch-k-generated \
            --json /tmp/batch-k-corpus.json | tee /tmp/batch-k-summary.txt
          python - <<'PY'
          import json
          from collections import Counter
          report=json.load(open('/tmp/batch-k-corpus.json', encoding='utf-8'))
          print('REMAINING BLOCKERS')
          reasons=Counter(r for item in report['results'] if item['status']=='skipped' for r in item['reasons'])
          for reason,count in reasons.most_common():
              print(f'GAP {reason} {count}')
          PY
      - name: Build globally safe fingerprint catalog
        run: |
          python tools/build_safe_fingerprint_catalog.py \
            --catalog catalog.json \
            --generated-dir /tmp/batch-k-generated \
            --output catalog.json \
            --report docs/productless-fingerprint-import-report.json
      - name: Test and validate refreshed catalog
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_catalog.py
      - name: Record Batch K development status
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.load(open('docs/productless-fingerprint-import-report.json', encoding='utf-8'))
          catalog=json.load(open('catalog.json', encoding='utf-8'))
          p=Path('docs/productless-development.md')
          text=p.read_text(encoding='utf-8') if p.exists() else '# Productless development\n'
          marker='\n## Batch K — exact fan mappings\n'
          section=(marker+
              f"\n- Generated candidates: **{report['generated_candidates']}**\n"
              f"- Safe productless fingerprints: **{report['safe_candidates']}**\n"
              f"- Blocked after global collision analysis: **{report['blocked_candidates']}**\n"
              f"- Catalog mappings including Product-ID mappings: **{len(catalog['mappings'])}**\n"
              "- Adds bounded exact enumerated fan speed mappings with closest-value writes, ordered oscillation exact/default mappings, typed preset raw values, optional presets, and safe raw fan extras.\n"
              "- Switchless fans and non-HA direction states remain fail-closed.\n"
              "- Stable branches remain untouched.\n")
          if marker in text:
              text=text.split(marker,1)[0]+section
          else:
              text=text.rstrip()+section
          p.write_text(text.rstrip()+"\n", encoding='utf-8')
          PY
      - name: Commit Batch K safe catalog refresh
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/productless-fingerprint-import-report.json docs/productless-development.md
          if git diff --cached --quiet; then
            echo "No catalog refresh changes"
            exit 0
          fi
          git commit -m "Refresh safe fingerprints after Batch K fan mappings"
          git push origin HEAD:develop
