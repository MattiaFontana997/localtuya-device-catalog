name: Patch residual light importer

on:
  push:
    paths:
      - .github/workflows/patch-light-residual-importer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch importer and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/import_tuya_local.py')
          s = p.read_text()

          old = '''    if not rules:\n        if dp_type != "boolean":\n            raise ConversionError("light_switch_non_boolean")\n        return\n'''
          new = '''    if not rules:\n        if dp_type == "boolean":\n            return\n        if dp_type == "hex":\n            raw_mask = dp.get("mask")\n            if (\n                not isinstance(raw_mask, str)\n                or not raw_mask\n                or len(raw_mask) % 2\n                or any(ch not in "0123456789abcdefABCDEF" for ch in raw_mask)\n                or int(raw_mask, 16) <= 0\n                or dp.get("endianness") not in (None, "big")\n            ):\n                raise ConversionError("light_switch_non_boolean")\n            allowed = {\n                "id", "type", "name", "optional", "readonly", "hidden",\n                "force", "persist", "sensitive", "mask", "endianness",\n            }\n            if set(dp) - allowed:\n                raise ConversionError("light_switch_non_boolean")\n            config["light_power_mask"] = raw_mask\n            return\n        raise ConversionError("light_switch_non_boolean")\n'''
          if old not in s:
              raise SystemExit('light power no-rules anchor missing')
          s = s.replace(old, new, 1)

          old = '''    switch = dps.get("switch")\n    if switch is None:\n        # LocalTuya's light entity currently requires a writable primary power DP.\n        raise ConversionError("light_missing_switch")\n    _check_common_dp_semantics(switch, writable=True)\n\n    config: dict[str, Any] = {\n        "id": _dp_id(switch),\n        "platform": "light",\n        "music_mode": False,\n    }\n    required: set[int] = set()\n    optional: set[int] = set()\n    _merge_membership(required, optional, switch)\n    _light_power_mapping(switch, config)\n'''
          new = '''    switch = dps.get("switch")\n    brightness = dps.get("brightness")\n    required: set[int] = set()\n    optional: set[int] = set()\n\n    if switch is None:\n        # Tuya Local permits a light whose brightness DP is also the power DP.\n        # Import only finite, fully enumerated string mappings with explicit\n        # Home Assistant endpoints, so reads/writes are deterministic.\n        if brightness is None:\n            raise ConversionError("light_missing_switch")\n        _check_common_dp_semantics(brightness, writable=True)\n        if _dp_type(brightness) != "string":\n            raise ConversionError("light_missing_switch")\n        rules = _mapping_rules(brightness)\n        if not rules or len(rules) > 32:\n            raise ConversionError("light_missing_switch")\n        brightness_values: dict[str, str] = {}\n        raw_values: set[str] = set()\n        friendly_values: set[int] = set()\n        for rule in rules:\n            if set(rule) != {"dps_val", "value"}:\n                raise ConversionError("light_brightness_power_mapping")\n            raw = rule.get("dps_val")\n            friendly = rule.get("value")\n            if (\n                not isinstance(raw, str)\n                or not raw\n                or isinstance(friendly, bool)\n                or not isinstance(friendly, int)\n                or not 0 <= friendly <= 255\n                or raw in raw_values\n                or friendly in friendly_values\n            ):\n                raise ConversionError("light_brightness_power_mapping")\n            brightness_values[str(friendly)] = raw\n            raw_values.add(raw)\n            friendly_values.add(friendly)\n        if 0 not in friendly_values or 255 not in friendly_values:\n            raise ConversionError("light_brightness_power_mapping")\n        config = {\n            "id": _dp_id(brightness),\n            "platform": "light",\n            "music_mode": False,\n            "brightness": _dp_id(brightness),\n            "brightness_lower": 0,\n            "brightness_upper": 255,\n            "brightness_values": brightness_values,\n            "brightness_as_power": True,\n        }\n        _merge_membership(required, optional, brightness)\n    else:\n        _check_common_dp_semantics(switch, writable=True)\n        config = {\n            "id": _dp_id(switch),\n            "platform": "light",\n            "music_mode": False,\n        }\n        _merge_membership(required, optional, switch)\n        _light_power_mapping(switch, config)\n'''
          if old not in s:
              raise SystemExit('light switch setup anchor missing')
          s = s.replace(old, new, 1)

          old = '''    brightness = dps.get("brightness")\n    if brightness is not None:\n        _check_common_dp_semantics(brightness, writable=True)\n'''
          new = '''    brightness = dps.get("brightness")\n    if brightness is not None and not config.get("brightness_as_power", False):\n        _check_common_dp_semantics(brightness, writable=True)\n'''
          if old not in s:
              raise SystemExit('brightness processing anchor missing')
          s = s.replace(old, new, 1)

          start = s.index('    color_temp = dps.get("color_temp")\n')
          end = s.index('    rgbhsv = dps.get("rgbhsv")\n', start)
          color_temp_block = '''    color_temp = dps.get("color_temp")\n    if color_temp is not None:\n        _check_common_dp_semantics(color_temp, writable=True)\n        if _dp_type(color_temp) != "integer":\n            raise ConversionError("light_color_temp_type")\n        raw_min, raw_max = _raw_integer_range(color_temp, "light_color_temp")\n        rules = _mapping_rules(color_temp)\n\n        has_explicit_values = any(\n            "dps_val" in rule or "value" in rule for rule in rules\n        )\n        if has_explicit_values:\n            if raw_max - raw_min > 64:\n                raise ConversionError("light_color_temp_discrete_range")\n            explicit: list[tuple[int, int]] = []\n            raw_seen: set[int] = set()\n            kelvin_seen: set[int] = set()\n            fallback_target = None\n            for rule in rules:\n                if set(rule) == {"dps_val", "value"}:\n                    raw = rule.get("dps_val")\n                    kelvin = rule.get("value")\n                    if (\n                        isinstance(raw, bool)\n                        or not isinstance(raw, int)\n                        or raw < raw_min\n                        or raw > raw_max\n                        or isinstance(kelvin, bool)\n                        or not isinstance(kelvin, int)\n                        or not 1500 <= kelvin <= 8000\n                        or raw in raw_seen\n                        or kelvin in kelvin_seen\n                    ):\n                        raise ConversionError("light_color_temp_discrete_mapping")\n                    explicit.append((kelvin, raw))\n                    raw_seen.add(raw)\n                    kelvin_seen.add(kelvin)\n                elif set(rule) == {"target_range"} and fallback_target is None:\n                    fallback_target = rule.get("target_range")\n                else:\n                    raise ConversionError("light_color_temp_discrete_mapping")\n\n            if raw_seen != set(range(raw_min, raw_max + 1)) or not explicit:\n                raise ConversionError("light_color_temp_discrete_mapping")\n            if (\n                not isinstance(fallback_target, dict)\n                or set(fallback_target) != {"min", "max"}\n                or fallback_target.get("min") != min(kelvin_seen)\n                or fallback_target.get("max") != max(kelvin_seen)\n            ):\n                raise ConversionError("light_color_temp_discrete_mapping")\n\n            config.update(\n                {\n                    "color_temp": _dp_id(color_temp),\n                    "color_temp_min_kelvin": min(kelvin_seen),\n                    "color_temp_max_kelvin": max(kelvin_seen),\n                    "color_temp_values": {str(kelvin): raw for kelvin, raw in explicit},\n                }\n            )\n            _merge_membership(required, optional, color_temp)\n        else:\n            if raw_min != 0:\n                raise ConversionError("light_color_temp_nonzero_min")\n            if len(rules) != 1:\n                raise ConversionError("light_color_temp_mapping")\n            rule = rules[0]\n            if set(rule) - {"target_range", "invert", "step"}:\n                raise ConversionError("light_color_temp_mapping")\n            step = rule.get("step", 1)\n            if isinstance(step, bool) or not isinstance(step, int) or step <= 0:\n                raise ConversionError("light_color_temp_step")\n            if step * round(raw_max / step) > raw_max:\n                raise ConversionError("light_color_temp_step_range")\n            invert = rule.get("invert", False)\n            if not isinstance(invert, bool):\n                raise ConversionError("light_color_temp_invert")\n            target = rule.get("target_range")\n            if not isinstance(target, dict) or set(target) != {"min", "max"}:\n                raise ConversionError("light_color_temp_target_range")\n            target_min = target["min"]\n            target_max = target["max"]\n            if (\n                isinstance(target_min, bool)\n                or isinstance(target_max, bool)\n                or not isinstance(target_min, (int, float))\n                or not isinstance(target_max, (int, float))\n                or int(target_min) != target_min\n                or int(target_max) != target_max\n            ):\n                raise ConversionError("light_color_temp_target_range")\n            target_min = int(target_min)\n            target_max = int(target_max)\n            if not (1500 <= target_min < target_max <= 8000):\n                raise ConversionError("light_color_temp_target_range")\n\n            _configure_light_scale(\n                config,\n                minimum=0,\n                maximum=raw_max,\n                reason="light_color_temp",\n                require_lower=False,\n            )\n            config.update(\n                {\n                    "color_temp": _dp_id(color_temp),\n                    "color_temp_min_kelvin": target_min,\n                    "color_temp_max_kelvin": target_max,\n                    "color_temp_reverse": invert,\n                }\n            )\n            if step != 1:\n                config["color_temp_step"] = step\n            _merge_membership(required, optional, color_temp)\n\n'''
          s = s[:start] + color_temp_block + s[end:]

          start = s.index('        if len(fmt) == 6:\n', s.index('    rgbhsv = dps.get("rgbhsv")'))
          end = s.index('        else:\n            raise ConversionError("light_rgbhsv_format")\n', start)
          end += len('        else:\n            raise ConversionError("light_rgbhsv_format")\n')
          rgb_block = '''        if len(fmt) == 6:\n            expected_names = (("r", 1), ("g", 1), ("b", 1), ("h", 2), ("s", 1), ("v", 1))\n            saturation_max = 255\n            value_min = 0\n            value_max = 255\n            for item, (name, byte_count) in zip(fmt, expected_names, strict=True):\n                if not isinstance(item, dict):\n                    raise ConversionError("light_rgbhsv_format")\n                if set(item) - {"name", "bytes", "range"}:\n                    raise ConversionError("light_rgbhsv_format")\n                if item.get("name") != name or item.get("bytes") != byte_count:\n                    raise ConversionError("light_rgbhsv_format")\n                value_range = item.get("range")\n                if name in {"r", "g", "b"}:\n                    if value_range is not None:\n                        raise ConversionError("light_rgbhsv_format")\n                    continue\n                if name == "h":\n                    if (\n                        not isinstance(value_range, dict)\n                        or set(value_range) != {"min", "max"}\n                        or value_range.get("min") != 0\n                        or value_range.get("max") != 360\n                    ):\n                        raise ConversionError("light_rgbhsv_format")\n                    continue\n                if value_range is None:\n                    minimum, maximum = 0, 255\n                elif (\n                    isinstance(value_range, dict)\n                    and set(value_range) == {"min", "max"}\n                    and isinstance(value_range.get("min"), int)\n                    and not isinstance(value_range.get("min"), bool)\n                    and isinstance(value_range.get("max"), int)\n                    and not isinstance(value_range.get("max"), bool)\n                ):\n                    minimum = value_range["min"]\n                    maximum = value_range["max"]\n                else:\n                    raise ConversionError("light_rgbhsv_format")\n                if minimum != 0 or maximum <= 0 or maximum > 255:\n                    raise ConversionError("light_rgbhsv_format")\n                if name == "s":\n                    saturation_max = maximum\n                else:\n                    value_min, value_max = minimum, maximum\n\n            config["color"] = _dp_id(rgbhsv)\n            config["color_rgb_encoding"] = True\n            if saturation_max != 255:\n                config["color_saturation_upper"] = saturation_max\n            _configure_light_scale(\n                config,\n                minimum=value_min,\n                maximum=value_max,\n                reason="light_rgbhsv",\n                require_lower=True,\n            )\n            _merge_membership(required, optional, rgbhsv)\n\n        elif len(fmt) == 3:\n            expected_names = ("h", "s", "v")\n            saturation_max = None\n            v_min = v_max = None\n            for item, name in zip(fmt, expected_names, strict=True):\n                if not isinstance(item, dict) or set(item) != {"name", "bytes", "range"}:\n                    raise ConversionError("light_rgbhsv_format")\n                if item.get("name") != name or item.get("bytes") != 2:\n                    raise ConversionError("light_rgbhsv_format")\n                value_range = item.get("range")\n                if not isinstance(value_range, dict) or set(value_range) != {"min", "max"}:\n                    raise ConversionError("light_rgbhsv_format")\n                minimum = value_range["min"]\n                maximum = value_range["max"]\n                if (\n                    isinstance(minimum, bool)\n                    or isinstance(maximum, bool)\n                    or not isinstance(minimum, int)\n                    or not isinstance(maximum, int)\n                ):\n                    raise ConversionError("light_rgbhsv_format")\n                if name == "h":\n                    if minimum != 0 or maximum != 360:\n                        raise ConversionError("light_rgbhsv_format")\n                elif name == "s":\n                    if minimum != 0 or maximum <= 0 or maximum > 65535:\n                        raise ConversionError("light_rgbhsv_format")\n                    saturation_max = maximum\n                else:\n                    if minimum < 0 or maximum <= minimum or maximum > 10000:\n                        raise ConversionError("light_rgbhsv_format")\n                    v_min, v_max = minimum, maximum\n\n            assert saturation_max is not None and v_min is not None and v_max is not None\n            _configure_light_scale(\n                config,\n                minimum=v_min,\n                maximum=v_max,\n                reason="light_rgbhsv",\n                require_lower=True,\n            )\n            config["color"] = _dp_id(rgbhsv)\n            if saturation_max != 1000:\n                config["color_saturation_upper"] = saturation_max\n            _merge_membership(required, optional, rgbhsv)\n        else:\n            raise ConversionError("light_rgbhsv_format")\n'''
          s = s[:start] + rgb_block + s[end:]
          p.write_text(s)

          pp = Path('tools/import_tuya_local_productless.py')
          ps = pp.read_text()
          old = '''    if entity.get("class") is not None:\n        raise ConversionError("time_device_class")\n    base._entity_metadata(entity, {})\n'''
          new = '''    time_class = entity.get("class")\n    if time_class not in (None, "duration"):\n        raise ConversionError("time_device_class")\n    # Tuya Local's time platform does not branch on class=duration; it is\n    # metadata only. LocalTuya reproduces the same component-folding semantics.\n    base._entity_metadata(entity, {})\n'''
          if old not in ps:
              raise SystemExit('time class anchor missing')
          pp.write_text(ps.replace(old, new, 1))

          tp = Path('tests/test_import_tuya_local_light_residuals.py')
          tp.write_text('''"""Regression tests for residual Tuya Local light encodings."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom tools.import_tuya_local import ConversionError, convert_profile\n\n\nclass ResidualLightImporterTests(unittest.TestCase):\n    @staticmethod\n    def _convert(dps):\n        result = convert_profile(\n            {"products": [{"id": "light"}], "entities": [{"entity": "light", "dps": dps}]},\n            source_file="light.yaml",\n        )\n        return result["entities"][0]["config"]\n\n    def test_masked_hex_switch_converts_exact_mask(self):\n        config = self._convert([{\n            "id": 123, "name": "switch", "type": "hex", "mask": "0008"\n        }])\n        self.assertEqual(config["id"], 123)\n        self.assertEqual(config["light_power_mask"], "0008")\n\n    def test_brightness_only_power_mapping_converts(self):\n        config = self._convert([{\n            "id": 101, "name": "brightness", "type": "string",\n            "mapping": [\n                {"dps_val": "level0", "value": 0},\n                {"dps_val": "level1", "value": 85},\n                {"dps_val": "level2", "value": 170},\n                {"dps_val": "level3", "value": 255},\n            ],\n        }])\n        self.assertTrue(config["brightness_as_power"])\n        self.assertEqual(config["id"], 101)\n        self.assertEqual(config["brightness"], 101)\n        self.assertEqual(config["brightness_values"], {\n            "0": "level0", "85": "level1", "170": "level2", "255": "level3"\n        })\n\n    def test_brightness_only_requires_off_and_full_on(self):\n        with self.assertRaisesRegex(ConversionError, "light_brightness_power_mapping"):\n            self._convert([{\n                "id": 101, "name": "brightness", "type": "string",\n                "mapping": [{"dps_val": "off", "value": 0}, {"dps_val": "mid", "value": 128}],\n            }])\n\n    def test_discrete_color_temperature_converts(self):\n        config = self._convert([\n            {"id": 20, "name": "switch", "type": "boolean"},\n            {"id": 22, "name": "brightness", "type": "integer", "range": {"min": 10, "max": 100}},\n            {\n                "id": 23, "name": "color_temp", "type": "integer", "range": {"min": 1, "max": 3},\n                "mapping": [\n                    {"dps_val": 1, "value": 3000},\n                    {"dps_val": 2, "value": 4000},\n                    {"dps_val": 3, "value": 6000},\n                    {"target_range": {"min": 3000, "max": 6000}},\n                ],\n            },\n        ])\n        self.assertEqual(config["color_temp_values"], {"3000": 1, "4000": 2, "6000": 3})\n        self.assertEqual(config["color_temp_min_kelvin"], 3000)\n        self.assertEqual(config["color_temp_max_kelvin"], 6000)\n\n    def test_color_temperature_step_converts(self):\n        config = self._convert([\n            {"id": 9, "name": "switch", "type": "boolean"},\n            {"id": 10, "name": "brightness", "type": "integer", "range": {"min": 0, "max": 100}, "mapping": [{"step": 2}]},\n            {\n                "id": 11, "name": "color_temp", "type": "integer", "range": {"min": 0, "max": 100},\n                "mapping": [{"step": 2, "invert": True, "target_range": {"min": 2700, "max": 6500}}],\n            },\n        ])\n        self.assertEqual(config["color_temp_step"], 2)\n        self.assertTrue(config["color_temp_reverse"])\n\n    def test_extended_rgbhsv_100_scales_are_preserved(self):\n        config = self._convert([\n            {"id": 27, "name": "switch", "type": "boolean"},\n            {"id": 29, "name": "brightness", "type": "integer", "range": {"min": 25, "max": 255}},\n            {\n                "id": 31, "name": "rgbhsv", "type": "hex",\n                "format": [\n                    {"name": "r", "bytes": 1}, {"name": "g", "bytes": 1}, {"name": "b", "bytes": 1},\n                    {"name": "h", "bytes": 2, "range": {"min": 0, "max": 360}},\n                    {"name": "s", "bytes": 1, "range": {"min": 0, "max": 100}},\n                    {"name": "v", "bytes": 1, "range": {"min": 0, "max": 100}},\n                ],\n            },\n        ])\n        self.assertTrue(config["color_rgb_encoding"])\n        self.assertEqual(config["color_saturation_upper"], 100)\n        self.assertEqual(config["color_brightness_lower"], 0)\n        self.assertEqual(config["color_brightness_upper"], 100)\n\n    def test_legacy_rgbhsv_saturation_100_converts(self):\n        config = self._convert([\n            {"id": 2, "name": "switch", "type": "boolean"},\n            {\n                "id": 11, "name": "rgbhsv", "type": "hex",\n                "format": [\n                    {"name": "h", "bytes": 2, "range": {"min": 0, "max": 360}},\n                    {"name": "s", "bytes": 2, "range": {"min": 0, "max": 100}},\n                    {"name": "v", "bytes": 2, "range": {"min": 0, "max": 1000}},\n                ],\n            },\n        ])\n        self.assertEqual(config["color_saturation_upper"], 100)\n        self.assertEqual(config["color_brightness_upper"], 1000)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          ttime = Path('tests/test_import_tuya_local_productless_time_duration.py')
          ttime.write_text('''"""Regression test for Tuya Local duration-class time entities."""\n\nfrom __future__ import annotations\n\nimport sys\nimport unittest\nfrom pathlib import Path\n\nTOOLS = Path(__file__).resolve().parents[1] / "tools"\nif str(TOOLS) not in sys.path:\n    sys.path.insert(0, str(TOOLS))\n\nfrom import_tuya_local_productless import convert_profile  # noqa: E402\n\n\nclass ProductlessDurationTimeTests(unittest.TestCase):\n    def test_duration_class_second_timer_is_lossless(self):\n        result = convert_profile(\n            {\n                "name": "Timer",\n                "products": [{"id": "synthetic"}],\n                "entities": [{\n                    "entity": "time", "class": "duration", "category": "config",\n                    "dps": [{"id": 26, "name": "second", "type": "integer", "optional": True, "range": {"min": 0, "max": 86400}}],\n                }, {"entity": "switch", "dps": [{"id": 20, "name": "switch", "type": "boolean"}]}],\n            },\n            source_file="timer.yaml",\n        )\n        time_config = next(entity["config"] for entity in result["entities"] if entity["platform"] == "time")\n        self.assertEqual(time_config["time_second_dp"], 26)\n        self.assertIn(26, result["match"]["optional_dps"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Run targeted tests
        run: |
          python -m unittest tests.test_import_tuya_local_light_residuals tests.test_import_tuya_local_light tests.test_import_tuya_local_light_switch_values tests.test_import_tuya_local_productless_time_duration tests.test_import_tuya_local_productless -v
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local.py tools/import_tuya_local_productless.py tests/test_import_tuya_local_light_residuals.py tests/test_import_tuya_local_productless_time_duration.py
          git diff --cached --check
          git commit -m "Support residual light encodings and duration timers"
          git push origin HEAD:develop
