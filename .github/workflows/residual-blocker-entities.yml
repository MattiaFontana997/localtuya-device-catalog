name: Residual blocker entity report

on:
  push:
    paths:
      - .github/workflows/residual-blocker-entities.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install YAML
        run: python -m pip install "PyYAML>=6,<7"
      - name: Fetch pinned upstream
        run: |
          git clone https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout 38347807cfc81ae8789974d98532eb928f42f174
      - name: Build blocker entity report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          skipped = json.loads(Path('productless-skipped-compact.json').read_text())
          prefix_platform = {
              'binary_sensor': 'binary_sensor', 'button': 'button', 'climate': 'climate',
              'cover': 'cover', 'event': 'event', 'fan': 'fan', 'humidifier': 'humidifier',
              'light': 'light', 'lock': 'lock', 'select': 'select', 'sensor': 'sensor',
              'switch': 'switch', 'vacuum': 'vacuum', 'valve': 'valve',
              'water_heater': 'water_heater', 'unsupported_platform': None,
          }
          out = []
          root = Path('/tmp/tuya-local/custom_components/tuya_local/devices')
          for item in skipped:
              data = yaml.safe_load((root / item['file']).read_text()) or {}
              entities = data.get('entities') or []
              selected = []
              wanted = set()
              broad = False
              for reason in item['reasons']:
                  head = reason.split(':', 1)[0]
                  if head.startswith('advanced_mapping_') or head.startswith('entity_') or head == 'dp_readonly' or head.startswith('multi_dp_'):
                      broad = True
                  elif head in prefix_platform and prefix_platform[head]:
                      wanted.add(prefix_platform[head])
                  elif head == 'unsupported_platform' and ':' in reason:
                      wanted.add(reason.split(':', 1)[1])
              for ent in entities:
                  if not isinstance(ent, dict):
                      continue
                  if broad or ent.get('entity') in wanted:
                      selected.append(ent)
              out.append({'file': item['file'], 'reasons': item['reasons'], 'entities': selected})
          Path('residual-blocker-entities.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add residual-blocker-entities.json
          git diff --cached --check
          git commit -m "Capture residual blocker entities"
          git push origin HEAD:develop
