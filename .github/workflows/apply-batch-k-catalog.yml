name: Apply Batch K Fan Catalog

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-k-catalog.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - name: Apply Batch K catalog patch
        run: python tools/_apply_batch_k_catalog.py
      - name: Compile importer and validators
        run: python -m py_compile tools/import_tuya_local_productless.py tools/fan_mapping.py tools/validate_catalog.py
      - name: Run catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate current catalog
        run: python tools/validate_catalog.py
      - name: Commit Batch K importer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tools/validate_catalog.py schema/catalog.schema.json
          if git diff --cached --quiet; then
            echo "Batch K catalog already applied"
            exit 0
          fi
          git commit -m "Add exact declarative fan mapping imports"
          git push origin HEAD:develop
