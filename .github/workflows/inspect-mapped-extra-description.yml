name: Inspect Mapped Extra Description Blockers

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/inspect-mapped-extra-description.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: tools
  UPSTREAM_REV: 38347807cfc81ae8789974d98532eb928f42f174

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate pinned candidates and report blocker fates
        run: |
          rm -rf /tmp/bitfield-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --revision "$UPSTREAM_REV" --output-dir /tmp/bitfield-generated --json /tmp/report.json | tee /tmp/summary.txt
          python - <<'PY'
          import json
          from collections import Counter
          report=json.load(open('/tmp/report.json',encoding='utf-8'))
          targets={
              'digma_disenseg1_gassensor.yaml',
              'eeese_anna_dehumidifier.yaml',
              'hiniso_dehumidifier.yaml',
              'kyvol_e30_vacuum.yaml',
              'salcar_t9w_thermostat.yaml',
              'wdyk_4p100a_energymeter.yaml',
              'zemismart_spm01_d2tw_energymeter.yaml',
              'zemismart_spm02d2tw_energymeter.yaml',
          }
          counts=Counter(i['status'] for i in report['results'])
          print('CORPUS_COUNTS', dict(sorted(counts.items())))
          for item in report['results']:
              if item['file'] in targets:
                  print('TARGET_RESULT', item['file'], item['status'], item.get('reasons', []))
          blockers=Counter()
          for item in report['results']:
              if item['status']=='skipped':
                  blockers.update(item.get('reasons', []))
          print('DESCRIPTION_BLOCKER_COUNT', blockers.get('multi_dp_mapped_extra:description',0))
          for reason,count in blockers.most_common(30):
              print('BLOCKER', count, reason)
          PY
      - name: Build and validate global safe catalog
        run: |
          python tools/build_safe_fingerprint_catalog.py --catalog catalog.json --generated-dir /tmp/bitfield-generated --output /tmp/catalog.json --report /tmp/productless-fingerprint-import-report.json
          python tools/validate_catalog.py /tmp/catalog.json
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import json
          c=json.load(open('/tmp/catalog.json',encoding='utf-8'))
          r=json.load(open('/tmp/productless-fingerprint-import-report.json',encoding='utf-8'))
          product=sum(bool(m.get('match',{}).get('product_ids')) for m in c['mappings'])
          fp=sum(m.get('match',{}).get('product_ids') == [] and m.get('match',{}).get('fingerprint') == {'mode':'exact_dps'} for m in c['mappings'])
          print('SAFE_COUNTS', {'generated':r['generated_candidates'],'safe':r['safe_candidates'],'blocked':r['blocked_candidates'],'total_mappings':len(c['mappings']),'product_id_mappings':product,'productless_fingerprints':fp})
          PY
      - name: Commit refreshed safe catalog
        run: |
          cp /tmp/catalog.json catalog.json
          cp /tmp/productless-fingerprint-import-report.json docs/productless-fingerprint-import-report.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/productless-fingerprint-import-report.json
          if git diff --cached --quiet; then
            echo 'Safe catalog already current'
            exit 0
          fi
          git commit -m 'Refresh safe catalog after bitfield descriptions'
          git push origin HEAD:develop
