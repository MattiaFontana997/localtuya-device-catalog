name: Patch number mode and valve step importer

on:
  push:
    paths:
      - .github/workflows/patch-number-mode-valve-step.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply importer patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/import_tuya_local.py')
          text = path.read_text()

          old = '''    unit = dp.get("unit")\n    if unit is not None:\n        if not isinstance(unit, str):\n            raise ConversionError("invalid_unit")\n        config["unit_of_measurement"] = unit\n\n    _entity_metadata(entity, config)\n    return _finish_single_entity("number", config, dp)\n'''
          new = '''    unit = dp.get("unit")\n    if unit is not None:\n        if not isinstance(unit, str):\n            raise ConversionError("invalid_unit")\n        config["unit_of_measurement"] = unit\n\n    mode = entity.get("mode")\n    if mode not in (None, "auto", "box", "slider"):\n        raise ConversionError("entity_mode")\n    if mode is not None:\n        config["number_mode"] = mode\n    metadata_entity = dict(entity)\n    metadata_entity.pop("mode", None)\n    _entity_metadata(metadata_entity, config)\n    return _finish_single_entity("number", config, dp)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''def _core_position_semantics(dp: dict[str, Any], *, reason: str, writable: bool) -> tuple[float, float, bool]:\n    _check_common_dp_semantics(dp, writable=writable)\n    if _dp_type(dp) != "integer":\n        raise ConversionError(f"{reason}_type")\n    rules = _mapping_rules(dp)\n    inverted = False\n    if rules:\n        if len(rules) != 1 or "dps_val" in rules[0]:\n            raise ConversionError(f"{reason}_mapping")\n        rule = rules[0]\n        if set(rule) - {"invert"}:\n            raise ConversionError(f"{reason}_mapping")\n        inverted = rule.get("invert", False)\n        if not isinstance(inverted, bool):\n            raise ConversionError(f"{reason}_mapping")\n    step = dp.get("step", 1)\n    if isinstance(step, bool) or not isinstance(step, (int, float)) or float(step) != 1.0:\n        raise ConversionError(f"{reason}_step")\n    raw_range = dp.get("range", {"min": 0, "max": 100})\n    if not isinstance(raw_range, dict) or "min" not in raw_range or "max" not in raw_range:\n        raise ConversionError(f"{reason}_range")\n    minimum = _range_value(raw_range["min"], 1.0, f"{reason}_range")\n    maximum = _range_value(raw_range["max"], 1.0, f"{reason}_range")\n    if maximum <= minimum:\n        raise ConversionError(f"{reason}_range")\n    return minimum, maximum, inverted\n'''
          new = '''def _core_position_semantics(dp: dict[str, Any], *, reason: str, writable: bool) -> tuple[float, float, bool, float]:\n    _check_common_dp_semantics(dp, writable=writable)\n    if _dp_type(dp) != "integer":\n        raise ConversionError(f"{reason}_type")\n    rules = _mapping_rules(dp)\n    inverted = False\n    write_step = 1.0\n    if rules:\n        if len(rules) != 1 or "dps_val" in rules[0]:\n            raise ConversionError(f"{reason}_mapping")\n        rule = rules[0]\n        if set(rule) - {"invert", "step"}:\n            raise ConversionError(f"{reason}_mapping")\n        inverted = rule.get("invert", False)\n        if not isinstance(inverted, bool):\n            raise ConversionError(f"{reason}_mapping")\n        raw_mapping_step = rule.get("step", 1)\n        if (\n            isinstance(raw_mapping_step, bool)\n            or not isinstance(raw_mapping_step, (int, float))\n            or not math.isfinite(float(raw_mapping_step))\n            or float(raw_mapping_step) <= 0\n        ):\n            raise ConversionError(f"{reason}_step")\n        write_step = float(raw_mapping_step)\n    dp_step = dp.get("step", 1)\n    if isinstance(dp_step, bool) or not isinstance(dp_step, (int, float)) or float(dp_step) != 1.0:\n        raise ConversionError(f"{reason}_step")\n    raw_range = dp.get("range", {"min": 0, "max": 100})\n    if not isinstance(raw_range, dict) or "min" not in raw_range or "max" not in raw_range:\n        raise ConversionError(f"{reason}_range")\n    minimum = _range_value(raw_range["min"], 1.0, f"{reason}_range")\n    maximum = _range_value(raw_range["max"], 1.0, f"{reason}_range")\n    if maximum <= minimum:\n        raise ConversionError(f"{reason}_range")\n    if writable and write_step != 1.0:\n        stepped_min = write_step * round(minimum / write_step)\n        stepped_max = write_step * round(maximum / write_step)\n        if stepped_min < minimum or stepped_max > maximum:\n            raise ConversionError(f"{reason}_step_range")\n    return minimum, maximum, inverted, write_step\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        minimum, maximum, inverted = _core_position_semantics(\n            valve, reason="valve_position", writable=True\n        )\n        config.update({\n            "valve_position_control": True,\n            "valve_position_min": minimum,\n            "valve_position_max": maximum,\n            "valve_position_inverted": inverted,\n        })\n'''
          new = '''        minimum, maximum, inverted, write_step = _core_position_semantics(\n            valve, reason="valve_position", writable=True\n        )\n        config.update({\n            "valve_position_control": True,\n            "valve_position_min": minimum,\n            "valve_position_max": maximum,\n            "valve_position_inverted": inverted,\n        })\n        if write_step != 1.0:\n            config["valve_position_step"] = write_step\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        cur_min, cur_max, cur_inverted = _core_position_semantics(\n            current, reason="valve_current_position", writable=False\n        )\n'''
          new = '''        cur_min, cur_max, cur_inverted, _ = _core_position_semantics(\n            current, reason="valve_current_position", writable=False\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_import_tuya_local_core_platforms.py')
          text = test.read_text()
          marker = '    def test_direct_lock_preserves_inverted_raw_values(self):\n'
          assert text.count(marker) == 1
          cases = '''    def test_number_preserves_explicit_slider_mode(self):\n        mapping = convert_profile(profile("number", [\n            {"id": 5, "name": "value", "type": "integer",\n             "range": {"min": 5, "max": 100}, "unit": "%"},\n        ], mode="slider"), source_file="number-slider.yaml")\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["number_mode"], "slider")\n        self.assertEqual(config["min_value"], 5.0)\n        self.assertEqual(config["max_value"], 100.0)\n\n    def test_number_unknown_mode_still_fails_closed(self):\n        with self.assertRaisesRegex(ConversionError, "entity_mode"):\n            convert_profile(profile("number", [\n                {"id": 5, "name": "value", "type": "integer",\n                 "range": {"min": 0, "max": 100}},\n            ], mode="dial"), source_file="number-dial.yaml")\n\n    def test_position_valve_preserves_write_only_mapping_step(self):\n        mapping = convert_profile(profile("valve", [\n            {"id": 102, "name": "valve", "type": "integer",\n             "mapping": [{"step": 5}]},\n        ], **{"class": "water"}), source_file="valve-step.yaml")\n        config = mapping["entities"][0]["config"]\n        self.assertTrue(config["valve_position_control"])\n        self.assertEqual(config["valve_position_min"], 0.0)\n        self.assertEqual(config["valve_position_max"], 100.0)\n        self.assertEqual(config["valve_position_step"], 5.0)\n\n'''
          test.write_text(text.replace(marker, cases + marker, 1))
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned profiles
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from import_tuya_local_fingerprints import convert_productless_profile
          root = Path('/tmp/tuya-local/custom_components/tuya_local/devices')
          rev = '38347807cfc81ae8789974d98532eb928f42f174'

          dekala = root / 'dekala_lumos_alarm_clock.yaml'
          result = convert_productless_profile(yaml.safe_load(dekala.read_text()), source_file=dekala.name, revision=rev)
          number = next(e for e in result['entities'] if e['platform'] == 'number' and e['config'].get('id') == 5)
          assert number['config']['number_mode'] == 'slider'

          qoto = root / 'qoto_03_sprinkler.yaml'
          result = convert_productless_profile(yaml.safe_load(qoto.read_text()), source_file=qoto.name, revision=rev)
          valve = next(e for e in result['entities'] if e['platform'] == 'valve')
          assert valve['config']['valve_position_step'] == 5.0
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local.py tests/test_import_tuya_local_core_platforms.py
          git diff --cached --check
          git commit -m "Import number modes and valve position steps"
          git push origin HEAD:develop
