name: Apply Safe Fingerprint Catalog

on:
  push:
    branches:
      - catalog-v3-import-safe-fingerprints
    paths:
      - ".github/workflows/apply-safe-fingerprint-catalog.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build and commit safe fingerprint snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog branch
        uses: actions/checkout@v7
        with:
          ref: catalog-v3-import-safe-fingerprints
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install tooling dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"

      - name: Checkout current Tuya Local
        uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          path: upstream-tuya-local
          fetch-depth: 1

      - name: Capture upstream revision
        id: upstream
        shell: bash
        run: echo "sha=$(git -C upstream-tuya-local rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate productless candidates
        run: |
          python tools/import_tuya_local_fingerprints.py \
            upstream-tuya-local \
            --revision "${{ steps.upstream.outputs.sha }}" \
            --output-dir generated-tuya-local-fingerprints \
            --json /tmp/tuya-local-fingerprint-import.json

      - name: Filter runtime-ambiguous candidates
        run: |
          python tools/build_safe_fingerprint_catalog.py \
            --catalog catalog.json \
            --generated-dir generated-tuya-local-fingerprints \
            --output /tmp/catalog.json \
            --report /tmp/fingerprint-report.json
          mv /tmp/catalog.json catalog.json
          cp /tmp/fingerprint-report.json docs/productless-fingerprint-import-report.json

      - name: Validate generated catalog
        run: |
          python tools/validate_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("docs/productless-fingerprint-import-report.json").read_text())
          assert report["generated_candidates"] == 38, report
          assert report["safe_candidates"] == 29, report
          assert report["blocked_candidates"] == 9, report
          print("Confirmed 29 safe and 9 blocked productless fingerprints")
          PY

      - name: Commit generated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json docs/productless-fingerprint-import-report.json
          if git diff --cached --quiet; then
            echo "Catalog already current"
            exit 0
          fi
          git commit -m "Import unambiguous productless Tuya Local fingerprints"
          git push origin HEAD:catalog-v3-import-safe-fingerprints
