name: Apply Climate Temperature Unit Aliases

on:
  push:
    branches: [develop]
    paths:
      - 'tools/_apply_climate_temperature_unit_aliases.py'
      - '.github/workflows/apply-climate-temperature-unit-aliases.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: tools

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - name: Apply importer patch
        run: python tools/_apply_climate_temperature_unit_aliases.py
      - name: Run productless tests
        run: python -m unittest tests.test_import_tuya_local_productless -v
      - name: Run full catalog suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit safe alias support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_import_tuya_local_productless.py
          if git diff --cached --quiet; then
            echo 'Alias support already current'
            exit 0
          fi
          git commit -m 'Reuse exact sibling temperature unit mappings'
          git push origin HEAD:develop
