name: Patch Light Brightness Null Fallback Importer

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-light-brightness-null-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: tools

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch importer and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/import_tuya_local.py')
          text = path.read_text()
          old = '''        brightness_step = 1\n        rules = _mapping_rules(brightness)\n        if rules:\n            if len(rules) != 1 or set(rules[0]) != {"step"}:\n                raise ConversionError("light_brightness_mapping")\n            step = rules[0].get("step")\n            if isinstance(step, bool) or not isinstance(step, int) or step <= 0:\n                raise ConversionError("light_brightness_mapping")\n            brightness_step = step\n'''
          new = '''        brightness_step = 1\n        brightness_null_value = None\n        rules = _mapping_rules(brightness)\n        if rules:\n            if len(rules) != 1:\n                raise ConversionError("light_brightness_mapping")\n            rule = rules[0]\n            if set(rule) == {"step"}:\n                step = rule.get("step")\n                if isinstance(step, bool) or not isinstance(step, int) or step <= 0:\n                    raise ConversionError("light_brightness_mapping")\n                brightness_step = step\n            elif (\n                set(rule) == {"dps_val", "value"}\n                and rule.get("dps_val") is None\n                and rule.get("value") == 0\n            ):\n                # Exact Tuya Local forward-only brightness fallback observed on\n                # XLD-CL002: a missing DP value is presented as brightness 0.\n                # Runtime applies this only while reading; writes stay numeric.\n                brightness_null_value = 0\n            else:\n                raise ConversionError("light_brightness_mapping")\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if brightness_step != 1:\n            config["brightness_step"] = brightness_step\n        _merge_membership(required, optional, brightness)\n'''
          new = '''        if brightness_step != 1:\n            config["brightness_step"] = brightness_step\n        if brightness_null_value is not None:\n            config["brightness_null_value"] = brightness_null_value\n        _merge_membership(required, optional, brightness)\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_import_tuya_local_light.py')
          text = test.read_text()
          old = '''    def test_brightness_mapping_non_step_stays_fail_closed(self):\n        with self.assertRaisesRegex(ConversionError, "light_brightness_mapping"):\n            convert_profile(\n                {\n                    "products": [{"id": "mapped-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 1, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 2,\n                                    "type": "integer",\n                                    "name": "brightness",\n                                    "range": {"min": 10, "max": 1000},\n                                    "mapping": [{"dps_val": None, "value": 0}],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="mapped_light.yaml",\n            )\n\n'''
          replacement = '''    def test_brightness_mapping_non_step_stays_fail_closed(self):\n        with self.assertRaisesRegex(ConversionError, "light_brightness_mapping"):\n            convert_profile(\n                {\n                    "products": [{"id": "mapped-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 1, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 2,\n                                    "type": "integer",\n                                    "name": "brightness",\n                                    "range": {"min": 10, "max": 1000},\n                                    "mapping": [{"dps_val": 0, "value": 0}],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="mapped_light.yaml",\n            )\n\n'''
          assert old in text
          text = text.replace(old, replacement, 1)
          marker = '    def test_brightness_mapping_non_step_stays_fail_closed(self):\n'
          addition = '''    def test_brightness_null_to_zero_mapping_converts_read_fallback(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "null-brightness-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 1, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 2,\n                                "type": "integer",\n                                "name": "brightness",\n                                "range": {"min": 10, "max": 1000},\n                                "mapping": [{"dps_val": None, "value": 0}],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="null_brightness_light.yaml",\n        )\n\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["brightness"], 2)\n        self.assertEqual(config["brightness_lower"], 10)\n        self.assertEqual(config["brightness_upper"], 1000)\n        self.assertEqual(config["brightness_null_value"], 0)\n        self.assertNotIn("brightness_step", config)\n\n    def test_brightness_null_mapping_other_value_stays_fail_closed(self):\n        with self.assertRaisesRegex(ConversionError, "light_brightness_mapping"):\n            convert_profile(\n                {\n                    "products": [{"id": "unsafe-null-brightness"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 1, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 2,\n                                    "type": "integer",\n                                    "name": "brightness",\n                                    "range": {"min": 10, "max": 1000},\n                                    "mapping": [{"dps_val": None, "value": 1}],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="unsafe_null_brightness.yaml",\n            )\n\n'''
          assert marker in text
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Run targeted tests
        run: |
          python -m pip install 'PyYAML>=6,<7' jsonschema
          python -m unittest tests.test_import_tuya_local_light
          python -m unittest tests.test_import_tuya_local_productless
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/import_tuya_local.py tests/test_import_tuya_local_light.py
          git diff --cached --check
          git commit -m 'Import null light brightness read fallback'
          git push origin HEAD:develop
