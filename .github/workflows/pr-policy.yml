name: Pull Request Policy

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest

    steps:
      - name: Enforce external contribution scope
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository =
              `${context.repo.owner}/${context.repo.repo}`;

            // Internal PRs are used by trusted maintenance
            // workflows such as mapping promotion.
            if (pr.head.repo.full_name === repository) {
              core.info(
                `Internal PR from ${pr.head.repo.full_name}; ` +
                `external contribution restrictions skipped.`
              );
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            if (files.length !== 1) {
              core.setFailed(
                "External contributions must add exactly " +
                "one submission file."
              );
              return;
            }

            const file = files[0];

            if (file.status !== "added") {
              core.setFailed(
                "External contributions may only add a new file."
              );
              return;
            }

            if (
              !/^submissions\/[A-Za-z0-9._-]+\.json$/.test(
                file.filename
              )
            ) {
              core.setFailed(
                "External contributions may only add " +
                "submissions/<mapping-id>.json"
              );
              return;
            }

            core.info(
              `Allowed external submission: ${file.filename}`
            );
