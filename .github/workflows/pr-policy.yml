name: Pull Request Policy

on:
  pull_request_target:
    branches:
      - main

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest

    steps:
      - name: Enforce contribution scope
        uses: actions/github-script@v7
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
        with:
          script: |
            const repository =
              `${context.repo.owner}/${context.repo.repo}`;

            let pr;

            if (context.eventName === "workflow_dispatch") {
              const rawPrNumber =
                process.env.DISPATCH_PR_NUMBER || "";

              if (!/^[1-9][0-9]*$/.test(rawPrNumber)) {
                core.setFailed("Invalid pull request number.");
                return;
              }

              const { data } =
                await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: Number(rawPrNumber),
                });

              pr = data;

              if (pr.state !== "open") {
                core.setFailed(
                  "The dispatched pull request is not open."
                );
                return;
              }

              if (
                pr.base.repo.full_name !== repository ||
                pr.base.ref !== "main"
              ) {
                core.setFailed(
                  "The dispatched pull request must target main."
                );
                return;
              }

              if (
                pr.head.repo.full_name !== repository ||
                !pr.head.ref.startsWith("promote/")
              ) {
                core.setFailed(
                  "Manual policy dispatch is allowed only for " +
                  "internal promotion pull requests."
                );
                return;
              }

              const dispatchedRef =
                context.ref.replace(
                  /^refs\/heads\//,
                  ""
                );

              if (pr.head.ref !== dispatchedRef) {
                core.setFailed(
                  "Workflow ref does not match the pull request head."
                );
                return;
              }

              if (pr.head.sha !== context.sha) {
                core.setFailed(
                  "Workflow SHA does not match the pull request head."
                );
                return;
              }

              core.info(
                `Validated dispatched promotion PR #${pr.number}.`
              );
            } else {
              pr = context.payload.pull_request;
            }

            if (!pr) {
              core.setFailed(
                "Unable to resolve pull request information."
              );
              return;
            }

            // Internal human-created PRs are trusted maintenance PRs.
            if (pr.head.repo.full_name === repository) {
              core.info(
                `Internal PR from ${pr.head.repo.full_name}; ` +
                `external contribution restrictions skipped.`
              );
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            if (files.length !== 1) {
              core.setFailed(
                "External contributions must add exactly " +
                "one submission file."
              );
              return;
            }

            const file = files[0];

            if (file.status !== "added") {
              core.setFailed(
                "External contributions may only add a new file."
              );
              return;
            }

            if (
              !/^submissions\/[A-Za-z0-9._-]+\.json$/.test(
                file.filename
              )
            ) {
              core.setFailed(
                "External contributions may only add " +
                "submissions/<mapping-id>.json"
              );
              return;
            }

            core.info(
              `Allowed external submission: ${file.filename}`
            );
