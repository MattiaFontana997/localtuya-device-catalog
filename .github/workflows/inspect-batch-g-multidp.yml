name: Inspect Batch G Multi-DP

on:
  push:
    branches: [develop]
    paths: [".github/workflows/inspect-batch-g-multidp.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Classify multi-DP blockers
        shell: bash
        run: |
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --json /tmp/report.json >/tmp/summary.txt
          cat /tmp/summary.txt
          PYTHONPATH=tools python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          import yaml
          import import_tuya_local_productless as ext

          report=json.load(open('/tmp/report.json', encoding='utf-8'))
          blocked=[item['file'] for item in report['results'] if item['status']=='skipped' and 'multi_dp_entity' in item['reasons']]
          root=Path('upstream-tuya-local/custom_components/tuya_local/devices')
          simple={'switch':'switch','binary_sensor':'sensor','sensor':'sensor','number':'value','select':'option'}
          shapes=Counter()
          print('MULTIDP_COUNT', len(blocked))
          for filename in blocked:
              profile=yaml.safe_load((root/filename).read_text(encoding='utf-8'))
              print('PROFILE', filename)
              for idx,entity in enumerate(profile.get('entities', [])):
                  if not isinstance(entity,dict):
                      continue
                  platform=entity.get('entity')
                  dps=entity.get('dps')
                  if platform not in simple or not isinstance(dps,list) or len(dps)<=1:
                      continue
                  names=[]
                  for dp in dps:
                      if not isinstance(dp,dict):
                          names.append('INVALID')
                          continue
                      mapping=dp.get('mapping')
                      mkeys=set()
                      if isinstance(mapping,list):
                          for rule in mapping:
                              if isinstance(rule,dict):
                                  mkeys.update(rule)
                                  conds=rule.get('conditions')
                                  if isinstance(conds,list):
                                      for c in conds:
                                          if isinstance(c,dict): mkeys.update('cond:'+k for k in c)
                      flags=[]
                      for k in ('optional','readonly','hidden','force','persist','sensitive'):
                          if k in dp: flags.append(f'{k}={dp[k]!r}')
                      names.append(f"{dp.get('name')}#{dp.get('id')}:{dp.get('type')}[{','.join(flags)}] map={','.join(sorted(mkeys)) or '-'}")
                  shape=(platform, tuple(dp.get('name') if isinstance(dp,dict) else '?' for dp in dps))
                  shapes[shape]+=1
                  print(f"  ENTITY {idx} {platform} primary={simple[platform]} :: " + ' | '.join(names))
          print('SHAPES')
          for (platform,names),count in shapes.most_common():
              print(count, platform, ','.join(names))
          PY
