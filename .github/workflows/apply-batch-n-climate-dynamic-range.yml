name: Apply Batch N Climate Dynamic Range

on:
  push:
    branches: [develop]
    paths:
      - 'tools/_apply_batch_n_climate_dynamic_range.py'
      - '.github/workflows/apply-batch-n-climate-dynamic-range.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - name: Apply importer patch
        run: python tools/_apply_batch_n_climate_dynamic_range.py
      - name: Run productless tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tests.test_import_tuya_local_productless -v
      - name: Run full catalog suite
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_import_tuya_local_productless.py
          if git diff --cached --quiet; then
            echo 'Importer support already current'
            exit 0
          fi
          git commit -m 'Support conditional climate target ranges'
          git push origin HEAD:develop
