name: Apply Batch N Climate Dependencies

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-n-climate-dependencies.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - run: python tools/_apply_batch_n_climate_dependencies.py
      - run: python -m py_compile tools/import_tuya_local_productless.py tests/test_productless_climate_dependencies.py
      - name: Run focused tests
        run: |
          python -m unittest tests.test_productless_climate_dependencies -v
          python -m unittest tests.test_productless_climate_units -v
          python -m unittest tests.test_productless_advanced_mapping_v2 -v
      - name: Run full suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_catalog.py
      - name: Commit dependency handling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_climate_dependencies.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep Climate redirect shadow DPS internal"
          git push origin HEAD:develop
