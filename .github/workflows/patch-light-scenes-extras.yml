name: Patch light scenes and extras

on:
  push:
    paths:
      - .github/workflows/patch-light-scenes-extras.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch importer and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tools/import_tuya_local.py')
          s = p.read_text()

          for name in ('sleep_mode', 'wakeup_mode', 'unknown_4', 'unknown_32', 'unknown_33', 'unknown_34', 'unknown_35', 'unknown_36'):
              marker = '    "scene_list",\n'
              if marker not in s:
                  raise SystemExit('supported/extra marker missing')
              s = s.replace(marker, f'    "{name}",\n' + marker)

          old = '''    if _dp_type(dp) not in {"string", "hex", "base64"}:\n        raise ConversionError(f"light_extra_attribute_type:{name}")\n'''
          new = '''    allowed_types = {"string", "hex", "base64"}\n    if name.startswith("unknown_") and name[len("unknown_") :].isdigit():\n        allowed_types.add("integer")\n    if _dp_type(dp) not in allowed_types:\n        raise ConversionError(f"light_extra_attribute_type:{name}")\n'''
          if old not in s:
              raise SystemExit('extra type anchor missing')
          s = s.replace(old, new, 1)

          old = '''            if raw.startswith("scene_"):\n                friendly = value.strip()\n                if not friendly or friendly in configured_scene_values:\n                    raise ConversionError("light_color_mode_duplicate")\n                configured_scene_values[friendly] = raw\n                observed[raw] = value\n                continue\n\n            if raw == "music" and value.strip().casefold() == "music":\n                config["music_mode"] = True\n                observed[raw] = value\n                continue\n\n            if raw == "scene":\n                if scene_dp is None or not configured_scene_values:\n                    raise ConversionError("light_scene_data_required")\n                observed[raw] = value\n                continue\n'''
          new = '''            if raw == "scene" and scene_dp is not None and configured_scene_values:\n                observed[raw] = value\n                continue\n\n            if raw.startswith("scene"):\n                friendly = value.strip()\n                if not friendly or friendly in configured_scene_values:\n                    raise ConversionError("light_color_mode_duplicate")\n                configured_scene_values[friendly] = raw\n                observed[raw] = value\n                continue\n\n            if raw == "music" and value.strip().casefold() == "music":\n                config["music_mode"] = True\n                observed[raw] = value\n                continue\n'''
          if old not in s:
              raise SystemExit('scene branch anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          tp = Path('tests/test_import_tuya_local_light.py')
          t = tp.read_text()
          pattern = re.compile(
              r'    def test_bare_scene_mode_requires_scene_data\(self\):\n.*?(?=    def test_mode_only_scenes_convert_to_scene_values)',
              re.S,
          )
          replacement = '''    def test_bare_scene_mode_converts_as_color_mode_effect(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "scene-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 20, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 21,\n                                "type": "string",\n                                "name": "color_mode",\n                                "mapping": [{"dps_val": "scene", "value": "Scene"}],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="scene_light.yaml",\n        )\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["scene_values"], {"Scene": "scene"})\n        self.assertEqual(config["color_mode"], 21)\n\n'''
          t, n = pattern.subn(replacement, t, count=1)
          if n != 1:
              raise SystemExit(f'bare scene test replacement count={n}')

          insert = '''    def test_scene_without_underscore_converts_as_mode_effect(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "atomi-like"}],\n                "entities": [{\n                    "entity": "light",\n                    "dps": [\n                        {"id": 20, "type": "boolean", "name": "switch"},\n                        {\n                            "id": 21, "type": "string", "name": "color_mode",\n                            "mapping": [\n                                {"dps_val": "scene1", "value": "Strobe"},\n                                {"dps_val": "scene9", "value": "Multi"},\n                            ],\n                        },\n                    ],\n                }],\n            },\n            source_file="atomi_like.yaml",\n        )\n        self.assertEqual(mapping["entities"][0]["config"]["scene_values"], {"Strobe": "scene1", "Multi": "scene9"})\n\n    def test_residual_plain_light_extras_are_preserved(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "residual-light"}],\n                "entities": [{\n                    "entity": "light",\n                    "dps": [\n                        {"id": 1, "type": "boolean", "name": "switch"},\n                        {"id": 4, "type": "integer", "name": "unknown_4"},\n                        {"id": 31, "type": "base64", "name": "sleep_mode", "optional": True},\n                        {"id": 32, "type": "hex", "name": "unknown_32", "optional": True},\n                        {"id": 33, "type": "hex", "name": "unknown_33", "optional": True},\n                        {"id": 34, "type": "hex", "name": "unknown_34", "optional": True},\n                        {"id": 35, "type": "hex", "name": "unknown_35", "optional": True},\n                        {"id": 36, "type": "hex", "name": "unknown_36", "optional": True},\n                    ],\n                }],\n            },\n            source_file="residual_light.yaml",\n        )\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["extra_state_attributes_dps"]["unknown_4"], 4)\n        self.assertEqual(config["extra_state_attributes_dps"]["sleep_mode"], 31)\n        self.assertEqual(config["extra_state_attributes_dps"]["unknown_36"], 36)\n        self.assertEqual(mapping["match"]["required_dps"], [1, 4])\n        self.assertEqual(mapping["match"]["optional_dps"], [31, 32, 33, 34, 35, 36])\n\n'''
          anchor = '    def test_simple_music_mode_is_preserved(self):\n'
          if anchor not in t:
              raise SystemExit('music test anchor missing')
          t = t.replace(anchor, insert + anchor, 1)

          old_expect = '    def test_scene_context_requires_matching_hidden_transport(self):\n        with self.assertRaisesRegex(ConversionError, "light_scene_data_required"):\n'
          new_expect = '    def test_scene_context_requires_matching_hidden_transport(self):\n        with self.assertRaisesRegex(ConversionError, "entity_hidden"):\n'
          if old_expect not in t:
              raise SystemExit('mismatched scene regression anchor missing')
          t = t.replace(old_expect, new_expect, 1)
          tp.write_text(t)
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run targeted light importer tests
        run: python -m unittest tests.test_import_tuya_local_light -v
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local.py tests/test_import_tuya_local_light.py
          git diff --cached --check
          git commit -m "Import light scene work modes and residual extras"
          git push origin HEAD:develop
