name: Run corrected Fairland bitfield importer patch

on:
  push:
    paths:
      - .github/workflows/run-fairland-bitfield-patch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch from reviewed helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/patch-binary-sensor-alias.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, 'fairland-importer-patch', 'exec'))
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned Fairland profile
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          rm -rf /tmp/fairland-generated
          mkdir -p /tmp/fairland-generated
          python tools/import_tuya_local_fingerprints.py /tmp/tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/fairland-generated \
            --json /tmp/fairland-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/fairland-report.json').read_text())
          item = next(x for x in report['results'] if x['file'] == 'fairland_rmic06_heatpump.yaml')
          assert item['status'] == 'convertible_fingerprint', item
          mapping_id = item['mapping_id']
          payload = json.loads((Path('/tmp/fairland-generated') / f'{mapping_id}.json').read_text())
          mapping = payload['mappings'][0]
          problem = [
              e for e in mapping['entities']
              if e['platform'] == 'binary_sensor' and e['config'].get('id') == 116
          ]
          assert len(problem) == 1, problem
          config = problem[0]['config']
          assert config['extra_state_attributes_dps'] == {
              'fault_code': 115, 'fault_code_2': 116
          }, config
          rules = config['advanced_mapping_by_dp']['116']
          assert rules[0]['bitmask'] is True, rules
          assert rules[0]['conditions'][0]['bitmask'] is True, rules
          assert rules[0]['conditions'][1]['bitmask'] is True, rules
          print('PINNED_CONVERTED', item)
          print('STATUS_COUNTS', report['status_counts'])
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_binary_sensor_alias.py
          git diff --cached --check
          git commit -m "Support advanced bitfield binary sensors"
          git push origin HEAD:develop
