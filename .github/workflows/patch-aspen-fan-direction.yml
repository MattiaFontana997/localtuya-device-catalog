name: Patch exact Aspen fan direction importer

on:
  push:
    paths:
      - .github/workflows/patch-aspen-fan-direction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply exact fan direction importer support
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Shared catalog-side bounded validator, kept equivalent to runtime.
          path = Path('tools/fan_mapping.py')
          text = path.read_text()
          marker = '\n\ndef validate_fan_speed_mapping(value: Any) -> dict[str, Any] | None:\n'
          assert text.count(marker) == 1
          addition = textwrap.dedent('''

          def validate_fan_direction_values(value: Any) -> dict[str, str] | None:
              """Validate a bounded exact friendly -> raw string direction map."""
              if not isinstance(value, dict) or not 2 <= len(value) <= 16:
                  return None
              result: dict[str, str] = {}
              raw_seen: set[str] = set()
              for raw_name, raw_value in value.items():
                  if not isinstance(raw_name, str) or not raw_name.strip():
                      return None
                  if not isinstance(raw_value, str) or not raw_value:
                      return None
                  name = raw_name.strip()
                  if name in result or raw_value in raw_seen:
                      return None
                  result[name] = raw_value
                  raw_seen.add(raw_value)
              if not {"forward", "reverse"}.issubset(result):
                  return None
              return result
          ''')
          path.write_text(text.replace(marker, addition + marker, 1))

          # Productless importer: retain mature two-way behavior, extend only
          # finite exact reversible string mappings such as Aspen exchange.
          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          old = '''from fan_mapping import (\n    coerce_fan_raw,\n    validate_fan_oscillation_mapping,\n    validate_fan_speed_mapping,\n)\n'''
          new = '''from fan_mapping import (\n    coerce_fan_raw,\n    validate_fan_direction_values,\n    validate_fan_oscillation_mapping,\n    validate_fan_speed_mapping,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    "fan_preset_hidden",\n    "fan_missing_switch",\n}\n'''
          new = '''    "fan_preset_hidden",\n    "fan_missing_switch",\n    "fan_direction_mapping",\n}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '\n\ndef _convert_fan_productless(entity: dict[str, Any]) -> base.Converted:\n'
          assert text.count(marker) == 1
          helper = textwrap.dedent('''

          def _fan_productless_direction(dp: dict[str, Any], config: dict[str, Any]) -> None:
              """Preserve finite exact Tuya Local string fan directions."""
              try:
                  base._fan_direction_config(dp, config)
                  return
              except ConversionError as err:
                  if str(err) != "fan_direction_mapping":
                      raise

              base._check_common_dp_semantics(dp, writable=True)
              if base._dp_type(dp) != "string":
                  raise ConversionError("fan_direction_mapping")
              rules = _raw_mapping(dp)
              if not rules or len(rules) > 16:
                  raise ConversionError("fan_direction_mapping")

              values: dict[str, str] = {}
              raw_seen: set[str] = set()
              for rule in rules:
                  if set(rule) != {"dps_val", "value"}:
                      raise ConversionError("fan_direction_mapping")
                  raw = rule.get("dps_val")
                  friendly = rule.get("value")
                  if (
                      not isinstance(raw, str)
                      or not raw
                      or not isinstance(friendly, str)
                      or not friendly
                      or friendly != friendly.strip()
                      or friendly in values
                      or raw in raw_seen
                  ):
                      raise ConversionError("fan_direction_mapping")
                  values[friendly] = raw
                  raw_seen.add(raw)

              normalized = validate_fan_direction_values(values)
              if normalized is None:
                  raise ConversionError("fan_direction_mapping")
              config["fan_direction"] = base._dp_id(dp)
              config["fan_direction_values"] = normalized
          ''')
          text = text.replace(marker, helper + marker, 1)

          old = '''    direction = dps.get("direction")\n    if direction is not None:\n        base._fan_direction_config(direction, config)\n        base._merge_membership(required, optional, direction)\n'''
          new = '''    direction = dps.get("direction")\n    if direction is not None:\n        _fan_productless_direction(direction, config)\n        base._merge_membership(required, optional, direction)\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          # Focused productless regressions.
          test = Path('tests/test_productless_fan_mappings.py')
          text = test.read_text()
          marker = '    def test_simple_fan_extra_dp_is_preserved(self):\n'
          assert text.count(marker) == 1
          cases = textwrap.dedent('''
              def test_three_way_string_direction_mapping_is_exact(self):
                  result = self._convert([
                      {"id": 1, "name": "switch", "type": "boolean"},
                      {"id": 2, "name": "direction", "type": "string", "mapping": [
                          {"dps_val": "in", "value": "forward"},
                          {"dps_val": "out", "value": "reverse"},
                          {"dps_val": "exch", "value": "exchange"},
                      ]},
                      {"id": 3, "name": "speed", "type": "integer", "range": {"min": 1, "max": 3}},
                  ])
                  config = result["entities"][0]["config"]
                  self.assertEqual(config["fan_direction"], 2)
                  self.assertEqual(config["fan_direction_values"], {
                      "forward": "in", "reverse": "out", "exchange": "exch",
                  })
                  self.assertIn(2, result["match"]["required_dps"])

              def test_direction_mapping_duplicate_raw_stays_fail_closed(self):
                  with self.assertRaisesRegex(ConversionError, "fan_direction_mapping"):
                      self._convert([
                          {"id": 1, "name": "switch", "type": "boolean"},
                          {"id": 2, "name": "direction", "type": "string", "mapping": [
                              {"dps_val": "same", "value": "forward"},
                              {"dps_val": "same", "value": "reverse"},
                              {"dps_val": "exch", "value": "exchange"},
                          ]},
                      ])

          ''')
          # Reindent dedented methods back under the testcase class.
          cases = ''.join('    ' + line if line.strip() else line for line in cases.splitlines(True))
          test.write_text(text.replace(marker, cases + marker, 1))
          PY
      - name: Syntax check
        run: python -m py_compile tools/fan_mapping.py tools/import_tuya_local_productless.py tests/test_productless_fan_mappings.py
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned Aspen profile
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from import_tuya_local_fingerprints import convert_productless_profile
          rev = '38347807cfc81ae8789974d98532eb928f42f174'
          src = Path('/tmp/tuya-local/custom_components/tuya_local/devices/aspen_asp200_fan.yaml')
          result = convert_productless_profile(yaml.safe_load(src.read_text()), source_file=src.name, revision=rev)
          fan = next(entity for entity in result['entities'] if entity['platform'] == 'fan')
          cfg = fan['config']
          assert cfg['fan_direction'] == 2, cfg
          assert cfg['fan_direction_values'] == {
              'forward': 'in', 'reverse': 'out', 'exchange': 'exch',
          }, cfg
          assert 2 in result['match']['required_dps'], result['match']
          print('PINNED_ASPEN_OK', result['match']['required_dps'], result['match'].get('optional_dps', []))
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/fan_mapping.py tools/import_tuya_local_productless.py tests/test_productless_fan_mappings.py
          git diff --cached --check
          git commit -m "Import exact fan direction mappings"
          git push origin HEAD:develop
