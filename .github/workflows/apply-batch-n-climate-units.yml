name: Apply Batch N Climate Units

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-n-climate-units.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - run: python tools/_apply_batch_n_climate_units.py
      - run: python -m py_compile tools/import_tuya_local_productless.py tests/test_productless_climate_units.py
      - name: Run focused tests
        run: |
          python -m unittest tests.test_productless_climate_units -v
          python -m unittest tests.test_import_tuya_local_climate -v
          python -m unittest tests.test_productless_advanced_mapping_v2 -v
      - name: Run full catalog suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_catalog.py
      - name: Commit Climate unit support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_climate_units.py
          if git diff --cached --quiet; then
            echo "Batch N climate units already applied"
            exit 0
          fi
          git commit -m "Normalize productless Climate C F unit mappings"
          git push origin HEAD:develop
