name: Patch Light Brightness Step Importer

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-light-brightness-step.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: tools

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch importer and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/import_tuya_local.py')
          text = path.read_text()
          old = '''    brightness = dps.get("brightness")\n    if brightness is not None:\n        _check_common_dp_semantics(brightness, writable=True)\n        if _dp_type(brightness) != "integer":\n            raise ConversionError("light_brightness_type")\n        if _mapping_rules(brightness):\n            raise ConversionError("light_brightness_mapping")\n        if brightness.get("step") not in (None, 1):\n            raise ConversionError("light_brightness_step")\n        minimum, maximum = _raw_integer_range(brightness, "light_brightness")\n        config.update(\n            {\n                "brightness": _dp_id(brightness),\n                "brightness_lower": minimum,\n                "brightness_upper": maximum,\n            }\n        )\n        _merge_membership(required, optional, brightness)\n'''
          new = '''    brightness = dps.get("brightness")\n    if brightness is not None:\n        _check_common_dp_semantics(brightness, writable=True)\n        if _dp_type(brightness) != "integer":\n            raise ConversionError("light_brightness_type")\n        brightness_step = 1\n        rules = _mapping_rules(brightness)\n        if rules:\n            if len(rules) != 1 or set(rules[0]) != {"step"}:\n                raise ConversionError("light_brightness_mapping")\n            step = rules[0].get("step")\n            if isinstance(step, bool) or not isinstance(step, int) or step <= 0:\n                raise ConversionError("light_brightness_mapping")\n            brightness_step = step\n        if brightness.get("step") not in (None, 1):\n            raise ConversionError("light_brightness_step")\n        minimum, maximum = _raw_integer_range(brightness, "light_brightness")\n        # Tuya Local applies mapping.step only on writes: step * round(raw / step).\n        # Keep the exact raw range for reads and pass the write quantizer to runtime.\n        if brightness_step * round(minimum / brightness_step) < minimum:\n            raise ConversionError("light_brightness_step_range")\n        if brightness_step * round(maximum / brightness_step) > maximum:\n            raise ConversionError("light_brightness_step_range")\n        config.update(\n            {\n                "brightness": _dp_id(brightness),\n                "brightness_lower": minimum,\n                "brightness_upper": maximum,\n            }\n        )\n        if brightness_step != 1:\n            config["brightness_step"] = brightness_step\n        _merge_membership(required, optional, brightness)\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_import_tuya_local_light.py')
          text = test.read_text()
          marker = '    def test_inverted_cct_mapping_sets_reverse(self):\n'
          assert marker in text
          addition = '''    def test_brightness_mapping_step_converts_losslessly(self):\n        mapping = convert_profile(\n            {\n                "products": [{"id": "stepped-light"}],\n                "entities": [\n                    {\n                        "entity": "light",\n                        "dps": [\n                            {"id": 1, "type": "boolean", "name": "switch"},\n                            {\n                                "id": 2,\n                                "type": "integer",\n                                "name": "brightness",\n                                "range": {"min": 10, "max": 1000},\n                                "mapping": [{"step": 10}],\n                            },\n                        ],\n                    }\n                ],\n            },\n            source_file="stepped_light.yaml",\n        )\n\n        config = mapping["entities"][0]["config"]\n        self.assertEqual(config["brightness"], 2)\n        self.assertEqual(config["brightness_lower"], 10)\n        self.assertEqual(config["brightness_upper"], 1000)\n        self.assertEqual(config["brightness_step"], 10)\n\n    def test_brightness_mapping_non_step_stays_fail_closed(self):\n        with self.assertRaisesRegex(ConversionError, "light_brightness_mapping"):\n            convert_profile(\n                {\n                    "products": [{"id": "mapped-light"}],\n                    "entities": [\n                        {\n                            "entity": "light",\n                            "dps": [\n                                {"id": 1, "type": "boolean", "name": "switch"},\n                                {\n                                    "id": 2,\n                                    "type": "integer",\n                                    "name": "brightness",\n                                    "range": {"min": 10, "max": 1000},\n                                    "mapping": [{"dps_val": None, "value": 0}],\n                                },\n                            ],\n                        }\n                    ],\n                },\n                source_file="mapped_light.yaml",\n            )\n\n'''
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Run targeted tests
        run: |
          python -m pip install 'PyYAML>=6,<7' jsonschema
          python -m unittest tests.test_import_tuya_local_light
          python -m unittest tests.test_import_tuya_local_productless
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/import_tuya_local.py tests/test_import_tuya_local_light.py
          git diff --cached --check
          git commit -m 'Import stepped light brightness mappings'
          git push origin HEAD:develop
