name: Run corrected select string raw mappings

on:
  push:
    paths:
      - .github/workflows/run-select-string-raw-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch with corrected tests
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          source = Path('.github/workflows/patch-select-string-raw.yml').read_text()
          helper_match = re.search(r"helper = base64\.b64decode\('([^']+)'\)\.decode\(\)", source)
          test_match = re.search(r"test_text = base64\.b64decode\('([^']+)'\)\.decode\(\)", source)
          if helper_match is None or test_match is None:
              raise SystemExit('encoded patch payloads not found')
          helper = base64.b64decode(helper_match.group(1)).decode()
          test_text = base64.b64decode(test_match.group(1)).decode()
          test_text = test_text.replace(
              'class ProductlessStringSelectMappingTests(unittest.TestCase):',
              'convert_select = productless._advanced_wrapper("select", base._convert_select)\n\n\nclass ProductlessStringSelectMappingTests(unittest.TestCase):',
          )
          test_text = test_text.replace('productless._CONVERTERS["select"]', 'convert_select')

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          anchor = 'def _prepare_typed_productless_select(\n'
          if '_normalize_string_select_raw_mapping' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one typed select helper anchor, found {text.count(anchor)}')
              text = text.replace(anchor, helper + anchor)
          old = '        elif platform == "select":\n            flagged, typed_select_mapping = _prepare_typed_productless_select(flagged)\n'
          new = '        elif platform == "select":\n            flagged = _normalize_string_select_raw_mapping(flagged)\n            flagged, typed_select_mapping = _prepare_typed_productless_select(flagged)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('select wrapper block not found')
          path.write_text(text)
          Path('tests/test_productless_select_string_mapping.py').write_text(test_text)
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5" pytest
      - name: Run targeted tests
        run: python -m pytest -q tests/test_productless_select_string_mapping.py tests/test_import_tuya_local_productless.py
      - name: Commit importer changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_select_string_mapping.py
          git diff --cached --check
          git commit -m "Normalize scalar raw values for string selects"
          git push origin HEAD:develop
