name: Patch dynamic Sensor and Number units

on:
  push:
    paths:
      - .github/workflows/patch-dynamic-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply importer patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          marker = '''def _store_mapped_extra(\n'''
          assert text.count(marker) == 1
          helper = '''def _dynamic_unit_runtime_rules(\n    dp: dict[str, Any], platform: str\n) -> list[dict[str, Any]]:\n    """Translate one consumed Tuya Local live-unit DP losslessly."""\n    name = "unit"\n    if dp.get("optional") is True:\n        # LocalTuya deliberately treats a missing cached DP as unknown and does\n        # not apply default mapping rules, unlike Tuya Local get_value(None).\n        raise ConversionError(f"{platform}_dynamic_unit_optional")\n    if base._dp_type(dp) != "string":\n        raise ConversionError(f"{platform}_dynamic_unit_type")\n\n    probe = copy.deepcopy(dp)\n    probe.pop("mapping", None)\n    base._preserve_core_extra(platform, name, probe, {}, set(), set())\n\n    rules = _raw_mapping(dp)\n    if not rules:\n        return []\n    translated: list[dict[str, Any]] = []\n    seen_raw: set[str] = set()\n    saw_default = False\n    for rule in rules:\n        if set(rule) - {"dps_val", "value", "hidden"}:\n            raise ConversionError(f"{platform}_dynamic_unit_mapping")\n        if "value" not in rule or not isinstance(rule.get("value"), str):\n            raise ConversionError(f"{platform}_dynamic_unit_mapping")\n        out: dict[str, Any] = {"value": rule["value"]}\n        if "hidden" in rule:\n            if not isinstance(rule.get("hidden"), bool):\n                raise ConversionError(f"{platform}_dynamic_unit_mapping")\n            out["hidden"] = rule["hidden"]\n        if "dps_val" in rule:\n            raw = rule.get("dps_val")\n            if not isinstance(raw, str) or raw in seen_raw:\n                raise ConversionError(f"{platform}_dynamic_unit_mapping")\n            seen_raw.add(raw)\n            out["dps_val"] = raw\n        else:\n            if saw_default:\n                raise ConversionError(f"{platform}_dynamic_unit_mapping")\n            saw_default = True\n        translated.append(out)\n    return translated\n\n\n'''
          text = text.replace(marker, helper + marker, 1)

          old = '''        if _raw_mapping(dp):\n            try:\n                rules = _mapped_extra_runtime_rules(dp, platform, name)\n            except ConversionError as err:\n                raise ConversionError(f"multi_dp_mapped_extra:{name}") from err\n            _store_mapped_extra(\n                platform, name, dp, rules, advanced_by_dp, config, required, optional\n            )\n            continue\n\n        raw_attrs = config.get("extra_state_attributes_dps", {})\n'''
          new = '''        if name == "unit" and platform in {"sensor", "number"}:\n            try:\n                rules = _dynamic_unit_runtime_rules(dp, platform)\n            except ConversionError as err:\n                raise ConversionError("multi_dp_mapped_extra:unit") from err\n            unit_dp = base._dp_id(dp)\n            existing_unit = config.get("dynamic_unit_dp")\n            if existing_unit is not None and int(existing_unit) != unit_dp:\n                raise ConversionError(f"{platform}_dynamic_unit_conflict")\n            config["dynamic_unit_dp"] = unit_dp\n            if rules:\n                key = str(unit_dp)\n                existing = advanced_by_dp.get(key)\n                if existing is not None and existing != rules:\n                    raise ConversionError(f"{platform}_dynamic_unit_mapping_conflict")\n                advanced_by_dp[key] = copy.deepcopy(rules)\n            base._merge_membership(required, optional, dp)\n            continue\n\n        if _raw_mapping(dp):\n            try:\n                rules = _mapped_extra_runtime_rules(dp, platform, name)\n            except ConversionError as err:\n                raise ConversionError(f"multi_dp_mapped_extra:{name}") from err\n            _store_mapped_extra(\n                platform, name, dp, rules, advanced_by_dp, config, required, optional\n            )\n            continue\n\n        raw_attrs = config.get("extra_state_attributes_dps", {})\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_productless_dynamic_units.py')
          test.write_text('''"""Productless live-unit DP importer regressions."""\n\nimport sys\nimport unittest\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1] / "tools"))\nimport import_tuya_local as base\n\n\nclass ProductlessDynamicUnitTests(unittest.TestCase):\n    def test_sensor_consumes_mapped_unit_dp(self):\n        entity = {\n            "entity": "sensor", "class": "temperature",\n            "dps": [\n                {"id": 18, "type": "integer", "name": "sensor", "class": "measurement"},\n                {"id": 101, "type": "string", "name": "unit", "mapping": [\n                    {"dps_val": "f", "value": "F"}, {"value": "C"}\n                ]},\n            ],\n        }\n        converted, required, optional = base._CONVERTERS["sensor"](entity)\n        config = converted["config"]\n        self.assertEqual(config["dynamic_unit_dp"], 101)\n        self.assertEqual(config["advanced_mapping_by_dp"]["101"], [\n            {"dps_val": "f", "value": "F"}, {"value": "C"}\n        ])\n        self.assertEqual(required, {18, 101})\n        self.assertEqual(optional, set())\n        self.assertNotIn("unit", config.get("extra_state_attributes_dps", {}))\n\n    def test_number_consumes_mapped_unit_dp(self):\n        entity = {\n            "entity": "number", "class": "temperature_delta",\n            "dps": [\n                {"id": 27, "type": "integer", "name": "value", "range": {"min": -5, "max": 5}},\n                {"id": 23, "type": "string", "name": "unit", "mapping": [\n                    {"dps_val": "f", "value": "F"}, {"value": "C"}\n                ]},\n            ],\n        }\n        converted, required, optional = base._CONVERTERS["number"](entity)\n        self.assertEqual(converted["config"]["dynamic_unit_dp"], 23)\n        self.assertEqual(required, {23, 27})\n        self.assertEqual(optional, set())\n\n    def test_optional_dynamic_unit_stays_fail_closed(self):\n        entity = {\n            "entity": "sensor", "class": "temperature",\n            "dps": [\n                {"id": 1, "type": "integer", "name": "sensor"},\n                {"id": 2, "type": "string", "name": "unit", "optional": True,\n                 "mapping": [{"value": "C"}]},\n            ],\n        }\n        with self.assertRaisesRegex(base.ConversionError, "multi_dp_mapped_extra:unit"):\n            base._CONVERTERS["sensor"](entity)\n''')
          PY
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned profiles
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from import_tuya_local_fingerprints import convert_productless_profile
          root = Path('/tmp/tuya-local/custom_components/tuya_local/devices')
          rev = '38347807cfc81ae8789974d98532eb928f42f174'
          for filename in (\n              'inkbird_iaqm129w_airqualitymonitor.yaml',\n              'nashone_mts700wb_thermostat.yaml',\n              'steinbach_silent_mini_heatpump.yaml',\n          ):\n              path = root / filename\n              result = convert_productless_profile(\n                  yaml.safe_load(path.read_text()), source_file=filename, revision=rev\n              )\n              dynamic = [\n                  entity for entity in result['entities']\n                  if entity['config'].get('dynamic_unit_dp') is not None\n              ]\n              assert dynamic, filename\n          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_dynamic_units.py
          git diff --cached --check
          git commit -m "Import dynamic sensor and number units"
          git push origin HEAD:develop
