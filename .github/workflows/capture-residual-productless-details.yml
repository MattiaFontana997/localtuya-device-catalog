name: Capture residual productless details

on:
  push:
    paths:
      - .github/workflows/capture-residual-productless-details.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7"
      - name: Fetch pinned Tuya Local
        run: |
          git clone https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout 38347807cfc81ae8789974d98532eb928f42f174
      - name: Capture only current skipped profiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          report = json.loads(Path('productless-import-report.json').read_text())
          root = Path('/tmp/tuya-local/custom_components/tuya_local/devices')
          out = {}
          for item in report['results']:
              if item.get('status') != 'skipped':
                  continue
              path = root / item['file']
              profile = yaml.safe_load(path.read_text())
              out[item['file']] = {
                  'reason': item.get('reasons', []),
                  'profile': profile,
              }
          assert len(out) == 39, len(out)
          Path('residual-productless-details.json').write_text(
              json.dumps(out, indent=2, sort_keys=True, ensure_ascii=False) + '\n'
          )
          PY
      - name: Commit residual snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add residual-productless-details.json
          git diff --cached --check
          git commit -m "Capture current residual productless profiles"
          git push origin HEAD:develop
