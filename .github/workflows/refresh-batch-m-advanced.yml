name: Refresh Batch M Advanced Catalog

on:
  push:
    branches: [develop]
    paths: [".github/workflows/refresh-batch-m-advanced.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate Batch M candidates
        run: |
          rm -rf /tmp/batch-m-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/batch-m-generated \
            --json /tmp/batch-m-corpus.json
      - name: Build globally safe fingerprints
        run: |
          python tools/build_safe_fingerprint_catalog.py \
            --catalog catalog.json \
            --generated-dir /tmp/batch-m-generated \
            --output catalog.json \
            --report docs/productless-fingerprint-import-report.json
      - name: Full tests and validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_catalog.py
      - name: Record Batch M status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          corpus=json.load(open('/tmp/batch-m-corpus.json',encoding='utf-8'))
          report=json.load(open('docs/productless-fingerprint-import-report.json',encoding='utf-8'))
          catalog=json.load(open('catalog.json',encoding='utf-8'))
          counts={}
          for item in corpus['results']: counts[item['status']]=counts.get(item['status'],0)+1
          p=Path('docs/productless-development.md')
          text=p.read_text(encoding='utf-8') if p.exists() else '# Productless development\n'
          marker='\n## Batch M — Advanced Mapping metadata\n'
          section=(marker
            + f"\n- Converter candidates: **{counts.get('convertible_fingerprint',0)}**\n"
            + f"- Remaining skipped productless profiles: **{counts.get('skipped',0)}**\n"
            + f"- Safe productless fingerprints: **{report['safe_candidates']}**\n"
            + f"- Blocked after global collision analysis: **{report['blocked_candidates']}**\n"
            + f"- Catalog mappings including Product-ID mappings: **{len(catalog['mappings'])}**\n"
            + "- Adds lossless conditional range/step metadata for Climate/Number and preserves static base transforms without double application.\n"
            + "- Fixes enum projection when advanced conditions are invalid/hidden-only.\n"
            + "- Condition scale, nested mappings, transformed redirect targets and unsupported recursive writes remain fail-closed.\n"
            + "- Stable branches remain untouched.\n")
          if marker in text: text=text.split(marker,1)[0]+section
          else: text=text.rstrip()+section
          p.write_text(text.rstrip()+'\n',encoding='utf-8')
          PY
      - name: Commit Batch M refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/productless-fingerprint-import-report.json docs/productless-development.md
          if git diff --cached --quiet; then
            echo "No Batch M refresh changes"
            exit 0
          fi
          git commit -m "Refresh safe fingerprints after Batch M advanced mappings"
          git push origin HEAD:develop
