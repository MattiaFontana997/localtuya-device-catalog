name: Inspect Batch H Binary Sensor

on:
  push:
    branches: [develop]
    paths: [".github/workflows/inspect-batch-h-binary-sensor.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate current importer report
        run: python tools/import_tuya_local_fingerprints.py upstream-tuya-local --json /tmp/report.json >/tmp/summary.txt
      - name: Classify Batch H blockers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import yaml

          report=json.load(open('/tmp/report.json', encoding='utf-8'))
          targets=[]
          for item in report['results']:
              if item['status'] != 'skipped':
                  continue
              reasons=set(item['reasons'])
              if 'binary_sensor_dp_type' in reasons or 'binary_sensor_complex_mapping' in reasons:
                  targets.append((item['file'], sorted(reasons)))

          root=Path('upstream-tuya-local/custom_components/tuya_local/devices')
          type_counts=Counter()
          shape_counts=Counter()
          print('TARGET_COUNT', len(targets))
          for filename,reasons in targets:
              profile=yaml.safe_load((root/filename).read_text(encoding='utf-8'))
              print(f'PROFILE {filename} REASONS={reasons}')
              for entity in profile.get('entities', []):
                  if entity.get('entity') != 'binary_sensor':
                      continue
                  print('  ENTITY', {k:v for k,v in entity.items() if k != 'dps'})
                  for dp in entity.get('dps', []):
                      if dp.get('name') != 'sensor':
                          continue
                      dtype=dp.get('type')
                      type_counts[dtype]+=1
                      mapping=dp.get('mapping')
                      mask=dp.get('mask')
                      shape=(dtype, bool(mask), tuple(sorted({k for r in mapping or [] if isinstance(r,dict) for k in r.keys()})))
                      shape_counts[shape]+=1
                      print('    SENSOR_DP', dp)
          print('TYPE_COUNTS', dict(type_counts))
          print('SHAPES')
          for shape,count in shape_counts.most_common():
              print(count, shape)
          PY
