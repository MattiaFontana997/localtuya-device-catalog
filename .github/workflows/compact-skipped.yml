name: Compact skipped profile report

on:
  push:
    paths:
      - .github/workflows/compact-skipped.yml

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build compact skipped report
        run: |
          python -c 'import json, pathlib; p=json.loads(pathlib.Path("productless-import-report.json").read_text()); out=[{"file":x["file"],"platforms":x.get("platforms",[]),"reasons":x.get("reasons",[])} for x in p["results"] if x.get("status")=="skipped"]; pathlib.Path("productless-skipped-compact.json").write_text(json.dumps(out, indent=2, sort_keys=True)+"\n")'
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add productless-skipped-compact.json
          git diff --cached --check
          git commit -m "Capture compact skipped productless report"
          git push origin HEAD:develop
