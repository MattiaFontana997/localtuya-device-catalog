name: Extract Batch O diagnostics

on:
  push:
    paths:
      - .github/workflows/extract-batch-o-diagnostics.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Extract advanced mapping blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('productless-import-report.json').read_text())
          items = [
              item for item in report['results']
              if any(reason.startswith('advanced_mapping_') for reason in item.get('reasons', []))
          ]
          Path('batch-o-diagnostics.json').write_text(json.dumps(items, indent=2) + '\n')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add batch-o-diagnostics.json
          git diff --cached --check
          git commit -m "Capture Batch O advanced mapping blockers"
          git push origin HEAD:develop
