name: Apply Batch L Water Heater Importer

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-l-water-heater.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - name: Apply Batch L importer patch
        run: python tools/_apply_batch_l_water_heater.py
      - name: Compile importer and tests
        run: python -m py_compile tools/import_tuya_local_productless.py tests/test_productless_water_heater.py
      - name: Run productless water-heater tests
        run: python -m unittest tests.test_productless_water_heater -v
      - name: Run full catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate current catalog
        run: python tools/validate_catalog.py
      - name: Commit Batch L importer and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_water_heater.py
          if git diff --cached --quiet; then
            echo "Batch L importer already applied"
            exit 0
          fi
          git commit -m "Add lossless productless water heater imports"
          git push origin HEAD:develop
