name: Inspect Block 1 low-risk residuals

on:
  push:
    paths:
      - .github/workflows/inspect-block1-lowrisk.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Fetch pinned Tuya Local
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
      - name: Diagnose selected productless conversions
        run: |
          python - <<'PY'
          import sys, traceback
          from pathlib import Path
          import yaml
          sys.path.insert(0, str(Path('tools').resolve()))
          import import_tuya_local_productless as p
          from import_tuya_local_fingerprints import convert_productless_profile

          revision = '38347807cfc81ae8789974d98532eb928f42f174'
          root = Path('/tmp/tuya-local')
          names = [
              'aquatech_x6_water_heater.yaml',
              'hiniso_dehumidifier.yaml',
              'parkside_ppwd30a1_vacuum.yaml',
              'rowenta_xplorer75s_vacuum.yaml',
              'advancedfires_1500_fireplace.yaml',
              'rgbcw_lightbulb_xld_cl002.yaml',
              'aosd_garagedoorwithlight.yaml',
          ]
          old_unit = p._water_heater_unit
          def debug_unit(value):
              print('WATER_HEATER_UNIT_INPUT', repr(value), type(value).__name__)
              return old_unit(value)
          p._water_heater_unit = debug_unit

          for name in names:
              print('\n===== DIAG', name, '=====')
              paths = list(root.rglob(name))
              if not paths:
                  print('NOT FOUND')
                  continue
              data = yaml.safe_load(paths[0].read_text())
              try:
                  result = convert_productless_profile(
                      data, source_file=name, revision=revision
                  )
                  print('SUCCESS')
                  for entity in result['entities']:
                      print('ENTITY', entity['platform'], entity['config'])
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc))
                  traceback.print_exc(limit=16)
          PY
