name: Cleanup Batch N Temporary Tooling

on:
  push:
    branches: [develop]
    paths: [".github/workflows/cleanup-batch-n.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Remove one-shot Batch N tooling
        run: |
          rm -f \
            .github/workflows/apply-batch-n-climate-dependencies.yml \
            .github/workflows/apply-batch-n-climate-limits.yml \
            .github/workflows/apply-batch-n-climate-units.yml \
            .github/workflows/apply-batch-n-hidden-swing.yml \
            .github/workflows/apply-batch-n-hvac-action.yml \
            .github/workflows/apply-batch-n-mapped-extras.yml \
            .github/workflows/inspect-batch-n-climate.yml \
            .github/workflows/build-batch-n-safe-catalog.yml \
            .github/workflows/cleanup-batch-n.yml \
            tools/_apply_batch_n_climate_dependencies.py \
            tools/_apply_batch_n_climate_limits.py \
            tools/_apply_batch_n_climate_units.py \
            tools/_apply_batch_n_hidden_swing.py \
            tools/_apply_batch_n_hvac_action_many_to_one.py \
            tools/_apply_batch_n_mapped_extras.py \
            tools/_fix_batch_n_mapped_extra_tests.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary Batch N tooling"
          git push origin HEAD:develop
