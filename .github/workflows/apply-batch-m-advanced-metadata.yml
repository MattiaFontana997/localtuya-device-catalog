name: Apply Batch M Advanced Metadata

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-m-advanced-metadata.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - run: python tools/_apply_batch_m_advanced_metadata.py
      - run: python -m py_compile tools/import_tuya_local_productless.py tests/test_productless_advanced_mapping_v2.py
      - name: Run Batch M tests
        run: |
          python -m unittest tests.test_productless_advanced_mapping_v2 -v
          python -m unittest tests.test_import_tuya_local_productless -v
          python -m unittest tests.test_productless_water_heater -v
      - name: Run full catalog tests and validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_catalog.py
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_advanced_mapping_v2.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Support conditional advanced mapping metadata"
          git push origin HEAD:develop
