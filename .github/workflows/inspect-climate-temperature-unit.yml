name: Inspect Climate Temperature Unit Blockers

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/inspect-climate-temperature-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: tools
  UPSTREAM_REV: 38347807cfc81ae8789974d98532eb928f42f174

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Measure exact unit support
        run: |
          rm -rf /tmp/unit-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --revision "$UPSTREAM_REV" --output-dir /tmp/unit-generated --json /tmp/report.json | tee /tmp/summary.txt
          python - <<'PY'
          import json
          from collections import Counter
          report=json.load(open('/tmp/report.json',encoding='utf-8'))
          print('CORPUS_COUNTS', dict(sorted(Counter(i['status'] for i in report['results']).items())))
          targets={
              'kogan_kawfpac12ya_airconditioner.yaml',
              'kogan_kawfpac16pya_airconditioner.yaml',
              'nashone_mts700wb_thermostat.yaml',
              'saswell_t29utk_thermostat.yaml',
              'steinbach_silent_mini_heatpump.yaml',
              'tesla_aux_airconditioner.yaml',
              'woods_cortina_airconditioner.yaml',
          }
          for item in report['results']:
              if item['file'] in targets:
                  print('TARGET_RESULT', item['file'], item['status'], item.get('reasons', []))
          blockers=Counter()
          for item in report['results']:
              if item['status']=='skipped':
                  blockers.update(item.get('reasons', []))
          print('UNIT_BLOCKER_COUNT', blockers.get('climate_temperature_unit_mapping',0))
          for reason,count in blockers.most_common(30):
              print('BLOCKER', count, reason)
          PY
      - name: Measure global safe catalog
        run: |
          python tools/build_safe_fingerprint_catalog.py --catalog catalog.json --generated-dir /tmp/unit-generated --output /tmp/catalog.json --report /tmp/productless-fingerprint-import-report.json
          python tools/validate_catalog.py /tmp/catalog.json
          python - <<'PY'
          import json
          c=json.load(open('/tmp/catalog.json',encoding='utf-8'))
          r=json.load(open('/tmp/productless-fingerprint-import-report.json',encoding='utf-8'))
          product=sum(bool(m.get('match',{}).get('product_ids')) for m in c['mappings'])
          fp=sum(m.get('match',{}).get('product_ids') == [] and m.get('match',{}).get('fingerprint') == {'mode':'exact_dps'} for m in c['mappings'])
          print('SAFE_COUNTS', {'generated':r['generated_candidates'],'safe':r['safe_candidates'],'blocked':r['blocked_candidates'],'total_mappings':len(c['mappings']),'product_id_mappings':product,'productless_fingerprints':fp})
          PY
