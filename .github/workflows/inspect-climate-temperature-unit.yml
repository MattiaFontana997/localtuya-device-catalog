name: Inspect Climate Temperature Unit Blockers

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/inspect-climate-temperature-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: tools

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7'
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Inspect exact unit blockers
        run: |
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --revision 38347807cfc81ae8789974d98532eb928f42f174 --json /tmp/report.json >/tmp/summary.txt
          cat /tmp/summary.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          report=json.load(open('/tmp/report.json',encoding='utf-8'))
          files=[
              item['file'] for item in report['results']
              if item['status']=='skipped'
              and 'climate_temperature_unit_mapping' in item.get('reasons',[])
          ]
          print('UNIT_BLOCKER_FILES', len(files), ', '.join(files))
          root=Path('upstream-tuya-local/custom_components/tuya_local/devices')
          for name in files:
              profile=yaml.safe_load((root/name).read_text(encoding='utf-8'))
              print('PROFILE', name)
              for ei,entity in enumerate(profile.get('entities',[])):
                  print(' ENTITY', ei, entity.get('entity'), 'translation_key=',entity.get('translation_key'))
                  dps=entity.get('dps',[])
                  for dp in dps:
                      if not isinstance(dp,dict):
                          continue
                      if dp.get('name')=='temperature_unit' or any(
                          isinstance(other,dict) and other.get('name')=='temperature_unit' and other.get('id')==dp.get('id')
                          for ent in profile.get('entities',[]) for other in ent.get('dps',[]) if isinstance(ent,dict)
                      ):
                          print('  DP', json.dumps(dp, sort_keys=True))
              climates=[e for e in profile.get('entities',[]) if e.get('entity')=='climate']
              for climate in climates:
                  unit=next((d for d in climate.get('dps',[]) if d.get('name')=='temperature_unit'),None)
                  if unit:
                      uid=unit.get('id')
                      aliases=[]
                      for ei,entity in enumerate(profile.get('entities',[])):
                          for dp in entity.get('dps',[]):
                              if isinstance(dp,dict) and dp.get('id')==uid:
                                  aliases.append((ei,entity.get('entity'),dp.get('name'),dp.get('type'),dp.get('mapping')))
                      print('  SAME_ID_ALIASES', repr(aliases))
          PY
