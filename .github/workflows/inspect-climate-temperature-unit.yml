name: Inspect Climate Temperature Unit Blockers

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/inspect-climate-temperature-unit.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: tools
  UPSTREAM_REV: 38347807cfc81ae8789974d98532eb928f42f174

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Generate pinned candidates
        run: |
          rm -rf /tmp/unit-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local --revision "$UPSTREAM_REV" --output-dir /tmp/unit-generated --json /tmp/report.json
      - name: Build and validate global safe catalog
        run: |
          python tools/build_safe_fingerprint_catalog.py --catalog catalog.json --generated-dir /tmp/unit-generated --output /tmp/catalog.json --report /tmp/productless-fingerprint-import-report.json
          python tools/validate_catalog.py /tmp/catalog.json
          cp /tmp/catalog.json catalog.json
          cp /tmp/productless-fingerprint-import-report.json docs/productless-fingerprint-import-report.json
      - name: Commit refreshed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/productless-fingerprint-import-report.json
          if git diff --cached --quiet; then
            echo 'SAFE_CATALOG_UNCHANGED'
            exit 0
          fi
          git commit -m 'Refresh safe catalog after temperature unit support'
          git push origin HEAD:develop
