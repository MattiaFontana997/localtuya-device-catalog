name: Patch Ampbolt static advanced rule

on:
  push:
    paths:
      - .github/workflows/patch-ampbolt-static-advanced-rule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply narrow static-rule overlay fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('tools/import_tuya_local_productless.py')
          text = path.read_text()
          old = '''        if not rule:\n            raise ConversionError("advanced_mapping_empty_rule")\n        translated.append(rule)\n'''
          new = '''        if not rule:\n            # A transform-only default remains owned by the mature base\n            # projection.  It must not also become an empty advanced overlay\n            # rule.  Keep this exception intentionally narrow: Ampbolt's\n            # default numeric scale is exact in the base sensor converter,\n            # while the advanced layer owns only the null redirect fallback.\n            if set(source) == {"scale"}:\n                _positive_transform(\n                    source["scale"], "advanced_mapping_static_scale"\n                )\n                continue\n            raise ConversionError("advanced_mapping_empty_rule")\n        translated.append(rule)\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_import_tuya_local_productless_advanced_static_rule.py')
          test.write_text(textwrap.dedent('''
          """Static transform rules must remain in the base projection only."""

          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / "tools"))
          import import_tuya_local as base
          import import_tuya_local_productless  # noqa: F401


          class AdvancedStaticRuleTests(unittest.TestCase):
              def test_scale_default_plus_null_redirect_is_lossless(self):
                  entity = {
                      "entity": "sensor",
                      "class": "power",
                      "dps": [
                          {
                              "id": 9,
                              "type": "integer",
                              "optional": True,
                              "name": "sensor",
                              "unit": "kW",
                              "class": "measurement",
                              "mapping": [
                                  {"scale": 1000},
                                  {"dps_val": None, "value_redirect": "single_phase"},
                              ],
                          },
                          {
                              "id": 5,
                              "type": "integer",
                              "optional": True,
                              "name": "single_phase",
                              "mapping": [{"scale": 1000}],
                          },
                      ],
                  }
                  converted, required, optional = base._CONVERTERS["sensor"](entity)
                  config = converted["config"]
                  self.assertEqual(config["id"], 9)
                  self.assertAlmostEqual(config["scaling"], 0.001)
                  self.assertEqual(
                      config["advanced_mapping_by_dp"]["9"],
                      [{"dps_val": None, "value_redirect_dp": 5}],
                  )
                  self.assertNotIn("5", config["advanced_mapping_by_dp"])
                  self.assertEqual(required, set())
                  self.assertEqual(optional, {5, 9})

              def test_invalid_static_scale_stays_fail_closed(self):
                  entity = {
                      "entity": "sensor",
                      "class": "power",
                      "dps": [
                          {
                              "id": 9,
                              "type": "integer",
                              "name": "sensor",
                              "mapping": [
                                  {"scale": 0},
                                  {"dps_val": None, "value_redirect": "fallback"},
                              ],
                          },
                          {"id": 5, "type": "integer", "name": "fallback"},
                      ],
                  }
                  with self.assertRaisesRegex(base.ConversionError, "advanced_mapping_static_scale"):
                      base._CONVERTERS["sensor"](entity)
          '''))
          PY
      - name: Syntax check
        run: python -m py_compile tools/import_tuya_local_productless.py tests/test_import_tuya_local_productless_advanced_static_rule.py
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5"
      - name: Run targeted and full tests
        run: |
          python -m unittest tests.test_import_tuya_local_productless_advanced_static_rule -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify pinned Ampbolt profile
        run: |
          git clone -q https://github.com/make-all/tuya-local.git /tmp/tuya-local
          git -C /tmp/tuya-local checkout -q 38347807cfc81ae8789974d98532eb928f42f174
          rm -rf /tmp/ampbolt-generated && mkdir -p /tmp/ampbolt-generated
          python tools/import_tuya_local_fingerprints.py /tmp/tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/ampbolt-generated \
            --json /tmp/ampbolt-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/ampbolt-report.json').read_text())
          item = next(x for x in report['results'] if x['file'] == 'ampbolt_portable_evcharger.yaml')
          assert item['status'] == 'convertible_fingerprint', item
          payload = json.loads((Path('/tmp/ampbolt-generated') / f"{item['mapping_id']}.json").read_text())
          mapping = payload['mappings'][0]
          power = next(e for e in mapping['entities'] if e['platform'] == 'sensor' and e['config'].get('id') == 9)
          cfg = power['config']
          assert abs(cfg['scaling'] - 0.001) < 1e-12, cfg
          assert cfg['advanced_mapping_by_dp']['9'] == [{'dps_val': None, 'value_redirect_dp': 5}], cfg
          assert 5 in mapping['match']['optional_dps'] and 9 in mapping['match']['optional_dps'], mapping['match']
          print('PINNED_CONVERTED', item)
          print('STATUS_COUNTS', report['status_counts'])
          PY
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_import_tuya_local_productless_advanced_static_rule.py
          git diff --cached --check
          git commit -m "Skip static-only advanced overlay rules"
          git push origin HEAD:develop
