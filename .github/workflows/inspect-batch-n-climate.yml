name: Inspect Batch N Climate Residuals

on:
  push:
    branches: [develop]
    paths: [".github/workflows/inspect-batch-n-climate.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "jsonschema>=4.23,<5" "PyYAML>=6,<7"
      - uses: actions/checkout@v7
        with:
          repository: make-all/tuya-local
          ref: 38347807cfc81ae8789974d98532eb928f42f174
          path: upstream-tuya-local
          fetch-depth: 1
      - name: Inspect current Climate blockers after dependency handling
        run: |
          rm -rf /tmp/batch-n-generated
          python tools/import_tuya_local_fingerprints.py upstream-tuya-local \
            --revision 38347807cfc81ae8789974d98532eb928f42f174 \
            --output-dir /tmp/batch-n-generated \
            --json /tmp/batch-n.json >/tmp/batch-n-summary.txt
          python - <<'PY'
          import json
          from collections import Counter
          r=json.load(open('/tmp/batch-n.json',encoding='utf-8'))
          counts=Counter(x['status'] for x in r['results'])
          reasons=Counter(y for x in r['results'] if x['status']=='skipped' for y in x['reasons'])
          print('BATCH_N_COUNTS',dict(sorted(counts.items())))
          for k,v in reasons.most_common(): print('GAP',k,v)
          print('CLIMATE_SKIPPED')
          for x in r['results']:
            hits=[y for y in x.get('reasons',[]) if y.startswith('climate_') or y.startswith('advanced_mapping')]
            if hits: print(x['file'],','.join(hits))
          PY
