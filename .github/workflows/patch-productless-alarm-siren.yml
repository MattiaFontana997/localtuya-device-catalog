name: Patch productless alarm and siren

on:
  push:
    paths:
      - .github/workflows/patch-productless-alarm-siren.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch
        run: python .github/scripts/patch_productless_alarm_siren.py
      - name: Install dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.23,<5" pytest
      - name: Run tests
        run: python -m pytest -q tests/test_productless_alarm_siren.py tests/test_import_tuya_local_productless.py
      - name: Commit importer support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/import_tuya_local_productless.py tests/test_productless_alarm_siren.py
          git diff --cached --check
          git commit -m "Import productless alarm panels and sirens"
          git push origin HEAD:develop
